<title>Majalis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Caveat:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=EB+Garamond:wght@400;500;600&display=swap">
<style>
/* Layout v2 : deux zones (lecture | tableau). Discussion, tafsir, glossaire et repères s'ouvrent dans un panneau à droite, à la demande. */
:root{
  --bg:#f4f6f4; --surface:#ffffff; --surface-2:#eef2ef; --line:#e1e7e3; --ink:#15221e; --muted:#5b6a64; --faint:#8a9792;
  --accent:#0d5c52; --accent-ink:#ffffff; --accent-soft:#dcebe6; --grid:#d5ddd8;
  --hl-theme:#e2eedb; --hl-question:#dde9f5; --hl-reflect:#f6ebcd; --hl-link:#f5e0e5;
  --c-ink:#1f2d29; --c-sand:#b07a14; --c-sage:#4a7a45; --c-rose:#ad4259; --c-sky:#2c6b9b;
  --note-ink:#ffffff; --note-sand:#fbf0d2; --note-sage:#e3efdb; --note-rose:#f8e1e6; --note-sky:#dde9f5;
  --me:#0d5c52; --k:#8f45ab; --shadow:0 1px 2px rgba(20,40,34,.05),0 6px 20px rgba(20,40,34,.08); --shadow-lg:0 8px 40px rgba(20,40,34,.16);
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"EB Garamond",Garamond,Georgia,"Times New Roman",serif;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --f-ar:"Amiri Quran","Amiri","Geeza Pro","Traditional Arabic",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#161e1b; --surface-2:#1c2622; --line:#26312d; --ink:#e5ece9; --muted:#97a6a0; --faint:#6f7d78;
  --accent:#62bcac; --accent-ink:#06201b; --accent-soft:#1c3a34; --grid:#24302b;
  --hl-theme:#24341e; --hl-question:#1b2e3e; --hl-reflect:#36301c; --hl-link:#382027;
  --c-ink:#e5ece9; --c-sand:#e1b45b; --c-sage:#8cc485; --c-rose:#e68aa0; --c-sky:#80b6e2;
  --note-ink:#1c2622; --note-sand:#373020; --note-sage:#233322; --note-rose:#382229; --note-sky:#1e2e3c;
  --me:#62bcac; --k:#c88be2; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 10px 44px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#161e1b; --surface-2:#1c2622; --line:#26312d; --ink:#e5ece9; --muted:#97a6a0; --faint:#6f7d78;
  --accent:#62bcac; --accent-ink:#06201b; --accent-soft:#1c3a34; --grid:#24302b;
  --hl-theme:#24341e; --hl-question:#1b2e3e; --hl-reflect:#36301c; --hl-link:#382027;
  --c-ink:#e5ece9; --c-sand:#e1b45b; --c-sage:#8cc485; --c-rose:#e68aa0; --c-sky:#80b6e2;
  --note-ink:#1c2622; --note-sand:#373020; --note-sage:#233322; --note-rose:#382229; --note-sky:#1e2e3c;
  --me:#62bcac; --k:#c88be2; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 10px 44px rgba(0,0,0,.5); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}

/* En-tête : séance à gauche, présence + discussion + inviter à droite */
header{display:flex;align-items:center;gap:12px;height:52px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-ar);font-size:18px;line-height:1;flex:none}
.sess{display:flex;align-items:center;min-width:0;flex:1;gap:2px}
#sessTitle{min-width:40px;max-width:440px;width:100%;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;font:600 15px var(--f-ui);color:var(--ink);text-overflow:ellipsis}
#sessTitle:hover{background:var(--surface-2)} #sessTitle:focus{border-color:var(--accent);background:var(--surface);outline:none}
.icon-btn{border:0;background:transparent;border-radius:8px;width:32px;height:32px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.hright{display:flex;align-items:center;gap:8px}
.avatars{display:flex;align-items:center;margin-right:4px}
.av{width:28px;height:28px;border-radius:50%;background:var(--c,var(--accent));color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;border:2px solid var(--surface);position:relative;flex:none}
.avatars .av+.av{margin-left:-7px}
.av .on{position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;background:#3fae62;border:2px solid var(--surface)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;font-weight:600;white-space:nowrap;position:relative}
.btn:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent}
.btn .n{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn .dot{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:8px;background:var(--c-rose);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}

/* Zones */
main{display:grid;grid-template-columns:var(--rw,400px) 1fr;min-height:0;position:relative;overflow:hidden}
body.wbw main{--rw:560px}
body.no-reader main{--rw:0px}
body.no-reader #reader{display:none}
#reader{grid-column:1;grid-row:1} #stage{grid-column:2;grid-row:1}
#reader{background:var(--surface);border-right:1px solid var(--line);min-height:0;display:flex;flex-direction:column;min-width:0}
.rhead{display:flex;align-items:center;gap:6px;padding:10px 12px 8px 16px}
select{font:600 14px var(--f-ui);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 8px;flex:1;min-width:0}
.modebar{display:flex;align-items:center;gap:10px;padding:0 16px 10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.segm{display:flex;background:var(--surface-2);border-radius:9px;padding:3px}
.segm button{border:0;background:transparent;border-radius:7px;padding:5px 14px;font-weight:600;color:var(--muted)}
.segm button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chars{display:flex;gap:3px;margin-left:auto;align-items:center}
.chars small{font-size:11px;color:var(--muted);margin-right:3px}
.chars button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:27px;height:27px;font-weight:600;font-size:14px;padding:0}
.chars button:hover{background:var(--surface-2)}
.scroll{overflow:auto;min-height:0;flex:1}

/* Lecture */
.surah-head{text-align:center;padding:22px 16px 6px}
.surah-head .ar{font-family:var(--f-ar);font-size:30px;line-height:1.6}
.surah-head .sub{color:var(--muted);font-size:12.5px}
.bism{font-family:var(--f-ar);text-align:center;font-size:21px;padding:2px 0 10px;color:var(--muted)}
.verses{list-style:none;margin:0;padding:4px 8px 20px;display:flex;flex-direction:column;gap:2px}
.verse{border-radius:12px;padding:12px 14px;cursor:pointer;position:relative;border:1px solid transparent}
.verse:hover{background:var(--surface-2)}
.verse.hl-theme{background:var(--hl-theme)} .verse.hl-question{background:var(--hl-question)} .verse.hl-reflect{background:var(--hl-reflect)} .verse.hl-link{background:var(--hl-link)}
.verse.is-sel{border-color:var(--accent)}
.vtop{display:flex;align-items:center;gap:8px;min-height:20px}
.vnum{font-size:11.5px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.vtop .grow{flex:1}
.mini{font-size:11px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:3px}
.mini svg{width:12px;height:12px}
.kpres{display:none;width:20px;height:20px;border-radius:50%;background:var(--k);color:#fff;font-size:10px;font-weight:700;place-items:center}
.verse.k-here .kpres{display:grid}
.verse .ar{font-family:var(--f-ar);font-size:25px;line-height:2;margin:4px 0 2px;text-align:right}
.verse .fr{font-family:var(--f-read);font-size:16.5px;line-height:1.5;margin:0}
.vbar{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;cursor:default}
.vbar button{border:0;background:var(--surface);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;box-shadow:inset 0 0 0 1px var(--line)}
.vbar button:hover{background:var(--surface-2)}
.vbar button svg{width:14px;height:14px;color:var(--muted)}
.vbar button[aria-expanded="true"]{box-shadow:inset 0 0 0 1.5px var(--ink)}
.hlpick{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;cursor:default}
.hlpick button{border:0;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.hlpick button::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--hlc,transparent)}
.hlpick button[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--ink)}
.hlpick .none::before{display:none}
.t-theme{--hlc:var(--c-sage)} .t-question{--hlc:var(--c-sky)} .t-reflect{--hlc:var(--c-sand)} .t-link{--hlc:var(--c-rose)}
.reader-foot{font-size:12px;color:var(--faint);padding:4px 22px 24px;line-height:1.5}
.wol{margin-top:8px;padding-top:8px;border-top:1px dashed color-mix(in srgb,var(--ink) 16%,transparent)}
.wolh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wol .lab{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.wol .free{font:16.5px/1.5 var(--f-read);margin:2px 0 0}
.card .wol .free{font-size:15.5px}
.ilin{display:flex;flex-wrap:wrap;direction:rtl;gap:4px 12px;margin-top:6px}
.ilin>span{display:flex;flex-direction:column;align-items:center;direction:ltr}
.ilin .a{font-family:var(--f-ar);font-size:16px;line-height:1.5;color:var(--muted)}
.ilin .w{font-size:12.5px;font-weight:600;color:var(--accent)}
.ilin .w.e{color:var(--faint);font-weight:400}
.link{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:3px 6px;border-radius:6px}
.link:hover{background:var(--surface-2);color:var(--ink)}

/* Mot à mot */
.prog{height:5px;border-radius:3px;background:var(--surface-2);margin:10px auto 4px;max-width:220px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.whelp{font-size:12px;color:var(--muted);line-height:1.5;margin:6px 16px 10px;text-align:center}
.whelp b{color:var(--ink);font-weight:600}
.wverse{border-radius:12px;padding:10px 12px 12px;border:1px solid var(--line);background:var(--surface)}
.wverse:focus-within{border-color:var(--accent)}
.wprog{font-size:11px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}
.wprog.full{color:var(--c-sage)}
.wtiles{display:flex;flex-wrap:wrap;direction:rtl;gap:10px 6px;margin:8px 0}
.wt{direction:ltr;display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:86px;max-width:200px;text-align:center}
.wt.merged .wa{background:var(--accent-soft)}
.wa{border:0;background:transparent;border-radius:8px;padding:0 8px;font-family:var(--f-ar);font-size:23px;line-height:1.75;position:relative;color:var(--ink)}
.wa:hover{background:var(--surface-2)}
.wdot{position:absolute;top:4px;left:3px;width:7px;height:7px;border-radius:50%;background:var(--c-rose)}
.wi{font:500 14px var(--f-ui);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 6px;text-align:center;width:100%;min-width:0}
.wi:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.wt.done .wi{background:var(--accent-soft);border-color:transparent}
.wi.sug::placeholder{color:var(--accent);opacity:.8;font-style:italic}
.wh{font-size:11px;color:var(--muted);line-height:1.3}
.ws{font-size:10.5px;color:var(--accent);font-weight:600}
.wfree{font:16px var(--f-read);color:var(--ink);background:transparent;border:0;border-top:1px dashed var(--line);padding:8px 2px 2px;width:100%}
.wfree:focus{outline:none;border-top-color:var(--accent)}
.wfr{font:14px/1.45 var(--f-read);color:var(--muted);margin:6px 0 0}
.chip{border:0;background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}

/* Tableau */
#stage{position:relative;overflow:hidden;touch-action:none;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1.1px,transparent 1.2px);min-width:0;user-select:none;-webkit-user-select:none}
#stage.t-select{cursor:default} #stage.t-hand,#stage.panning{cursor:grab} #stage.panning{cursor:grabbing}
#stage.t-pen,#stage.t-rect,#stage.t-arrow{cursor:crosshair} #stage.t-note,#stage.t-text{cursor:copy}
#stage.drop{box-shadow:inset 0 0 0 3px var(--accent)}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
.svgl{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.hit{stroke:transparent;fill:none;pointer-events:stroke;cursor:move}
#stage.t-arrow .hit{cursor:crosshair}
.handle{fill:var(--surface);stroke:var(--accent);pointer-events:all;cursor:nwse-resize}
.selbox{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4}
.hovbox{fill:none;stroke:var(--accent);stroke-width:2.5}
#els{position:absolute;left:0;top:0}
.el{position:absolute;cursor:move}
#stage.t-arrow .el{cursor:crosshair}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 14px 12px;border-top:4px solid var(--line)}
.card.hl-theme{border-top-color:var(--c-sage)} .card.hl-question{border-top-color:var(--c-sky)} .card.hl-reflect{border-top-color:var(--c-sand)} .card.hl-link{border-top-color:var(--c-rose)}
.card .vh{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.card .vh .grow{flex:1}
.card .ar{font-family:var(--f-ar);font-size:24px;line-height:1.9;text-align:right;margin:4px 0}
.card .fr{font-family:var(--f-read);font-size:15.5px;line-height:1.45}
.cbadge{display:inline-flex;align-items:center;gap:3px;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:1px 7px;font-size:11px}
.cbadge svg{width:11px;height:11px}
.wcard .wrow{display:flex;flex-wrap:wrap;gap:6px 12px;margin:8px 0 4px}
.wc{display:flex;flex-direction:column;align-items:center}
.wcard .wc .ar{font-size:22px;margin:0;line-height:1.6;text-align:center}
.wo{font-size:13px;font-weight:600;color:var(--accent);font-family:var(--f-ui)}
.wo.empty{color:var(--faint);font-weight:400}
.wfree-c{border-top:1px dashed var(--line);padding-top:6px;margin-top:4px}
.note{border-radius:4px 4px 14px 4px;box-shadow:var(--shadow);padding:12px 14px 10px;font-family:var(--f-read);font-size:16.5px;line-height:1.45;border:1px solid color-mix(in srgb,var(--ink) 8%,transparent)}
.n-ink{background:var(--note-ink)} .n-sand{background:var(--note-sand)} .n-sage{background:var(--note-sage)} .n-rose{background:var(--note-rose)} .n-sky{background:var(--note-sky)}
.editable{white-space:pre-wrap;word-break:break-word;outline:none;min-height:1.5em}
.editable[contenteditable="true"]{cursor:text;user-select:text;-webkit-user-select:text}
.editable:empty::before{content:attr(data-ph);color:var(--muted)}
.nby{display:flex;align-items:center;gap:6px;margin-top:8px;font-family:var(--f-ui);font-size:11.5px;color:var(--muted);font-weight:600}
.nby i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.text{font-weight:700;line-height:1.25;padding:2px 4px}
.text.s-lg{font-size:28px;letter-spacing:-.01em} .text.s-md{font-size:18px}
.note.hand{font-family:var(--f-hand);font-size:22px;line-height:1.2;font-weight:500}
.note.hand .nby{margin-top:6px}
.text.hand{font-family:var(--f-hand);font-weight:700;letter-spacing:0}
.text.hand.s-lg{font-size:38px} .text.hand.s-md{font-size:26px}
.bendh{fill:var(--surface);stroke:var(--accent);pointer-events:all;cursor:grab}
.palette .psep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.segm.sm{padding:2px} .segm.sm button{padding:3px 10px;font-size:12px}
.tc-ink{color:var(--c-ink)} .tc-sand{color:var(--c-sand)} .tc-sage{color:var(--c-sage)} .tc-rose{color:var(--c-rose)} .tc-sky{color:var(--c-sky)}

/* Contrôles flottants du tableau : outils en bas au centre, le reste dans les coins */
.dock{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:6;max-width:calc(100% - 24px)}
.toolbar{display:flex;align-items:stretch;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:var(--shadow);overflow-x:auto;max-width:100%}
.tool{display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:transparent;border-radius:10px;padding:6px 8px 4px;min-width:52px;font-size:10.5px;font-weight:600;color:var(--muted)}
.tool svg{width:19px;height:19px;color:var(--ink)}
.tool:hover{background:var(--surface-2)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tool[aria-pressed="true"] svg{color:var(--accent-ink)}
.tsep{width:1px;background:var(--line);margin:6px 3px}
.palette{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px;box-shadow:var(--shadow)}
.palette small{font-size:11px;color:var(--muted);font-weight:600;margin-right:2px}
.dotbtn{width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);background:var(--dc);box-shadow:0 0 0 1px var(--line);padding:0}
.dotbtn[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.toolhint{background:var(--ink);color:var(--bg);border-radius:10px;padding:7px 12px;font-size:12.5px;line-height:1.45;max-width:440px;text-align:center;box-shadow:var(--shadow);animation:tin .2s ease}
.toolhint b{font-weight:700}
.corner{position:absolute;display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;box-shadow:var(--shadow);z-index:5}
.corner button{border:0;background:transparent;border-radius:8px;padding:5px 8px;font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;color:var(--ink)}
.corner button:hover:not(:disabled){background:var(--surface-2)} .corner button:disabled{opacity:.35;cursor:default}
.corner svg{width:16px;height:16px}
.c-zoom{right:14px;top:14px}
.csep{width:1px;background:var(--line);margin:4px 3px}
.c-open{left:14px;top:14px}
.c-open button{white-space:nowrap;padding:6px 10px}
#seltools{position:absolute;z-index:7;display:flex;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 16px);gap:2px;background:var(--ink);color:var(--bg);border-radius:10px;padding:3px;box-shadow:var(--shadow);transform:translate(-50%,-100%)}

  if(!m.length){const lk=loose(k);m=all.filter(x=>loose(x.key)===lk);kind="close"}if(!m.length)return null;
  const cnt={};m.forEach(x=>cnt[x.text]=(cnt[x.text]||0)+1);const text=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];return{text,kind,ref:m.find(x=>x.text===text).ref}}
function surahProgress(s){let n=0,d=0;SURAHS[s].verses.forEach((v,k)=>{const ref=`${s}:${k+1}`,dd=state.wbw[ref];tiles(ref).forEach(t=>{n++;if(dd&&(dd.t[t.i]||"").trim())d++})});return{n,d}}
function wolText(ref){const d=state.wbw[ref];if(!d)return"";const free=(d.free||"").trim();if(free)return free;return tiles(ref).map(t=>(d.t[t.i]||"").trim()).filter(Boolean).join(" ")}
function wolBlock(ref,edit=true){if(state.showWolof===false)return"";const tx=wolText(ref);if(!tx)return"";
  return`<p class="wolf" lang="wo">${esc(tx)}${edit?` <button class="link wedit" data-wedit="${ref}">Modifier</button>`:""}</p>`}

/* ---------- Rendu du tableau ---------- */
function commentCount(kind,key){return state.comments.filter(c=>c.sid===state.current&&c.anchor&&c.anchor.kind===kind&&(kind==="verse"?c.anchor.ref===key:c.anchor.id===key)).length}
function htmlFor(e){
  const st=`left:${e.x}px;top:${e.y}px;width:${e.w}px`;
  if(e.type==="verse"&&e.mode==="wbw"){const v=verse(e.ref);const d=state.wbw[e.ref]||{t:{}};const cc=commentCount("el",e.id);
    return`<div class="el card wcard" data-id="${e.id}" style="${st}"><div class="vh"><span class="grow">${esc(v.label)} · mot à mot</span>${cc?`<span class="cbadge">${ICON.comment}${cc}</span>`:""}</div><div class="wrow" dir="rtl">${tiles(e.ref).map(t=>`<span class="wc"><span class="ar" lang="ar">${t.ar}</span><span class="wo ${d.t[t.i]?"":"empty"}" dir="ltr">${esc(d.t[t.i]||"—")}</span></span>`).join("")}</div>${d.free?`<div class="fr wfree-c">${esc(d.free)}</div>`:""}</div>`}
  if(e.type==="verse"){const v=verse(e.ref);const h=hls()[e.ref];const cc=commentCount("verse",e.ref)+commentCount("el",e.id);
    return`<div class="el card ${h?"hl-"+h:""}" data-id="${e.id}" style="${st}"><div class="vh"><span class="grow">${esc(v.label)}</span>${cc?`<span class="cbadge">${ICON.comment}${cc}</span>`:""}</div><div class="ar" lang="ar" dir="rtl">${v.ar}</div><div class="fr">${esc(v.fr)}</div>${wolBlock(e.ref,false)}</div>`}
  if(e.type==="note"){const m=MEMBERS[e.by]||MEMBERS.me;const cc=commentCount("el",e.id);
    return`<div class="el note n-${e.color} ${e.style==="hand"?"hand":""}" data-id="${e.id}" style="${st}"><div class="editable" data-ph="Écris ta réflexion…">${esc(e.text)}</div><div class="nby"><i style="--c:${m.c}"></i>${m.name}${cc?` · <span class="cbadge">${ICON.comment}${cc}</span>`:""}</div></div>`}
  if(e.type==="text")return`<div class="el text s-${e.size||"md"} tc-${e.color} ${e.style==="hand"?"hand":""}" data-id="${e.id}" style="${st}"><div class="editable" data-ph="Titre…">${esc(e.text)}</div></div>`;
  return"";
}
function renderBoard(){
  const b=board();
  if(!editingId){els.innerHTML=b.map(htmlFor).join("");els.querySelectorAll(".el").forEach(n=>sizes[n.dataset.id]={w:n.offsetWidth,h:n.offsetHeight})}
  let back="",front="";const iz=1/cam.z;
  for(const e of b){const col=`var(--c-${e.color||"ink"})`;
    if(e.type==="rect")back+=rectSvg(e,iz);
    if(e.type==="arrow")back+=arrowSvg(e,iz);
    if(e.type==="stroke"){const d=pathD(e.points,e.x,e.y);front+=`<g data-id="${e.id}"><path class="hit" d="${d}" stroke-width="${14*iz}" stroke-linecap="round"/><path d="${d}" fill="none" style="stroke:${col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>`}
  }
  const s=selId&&el(selId);
  if(s&&!(drag&&["pen","rect","arrow"].includes(drag.kind))){const bb=bbox(s);if(bb){const p=6*iz;front+=`<rect class="selbox" x="${bb.x-p}" y="${bb.y-p}" width="${bb.w+2*p}" height="${bb.h+2*p}" rx="${8*iz}" vector-effect="non-scaling-stroke"/>`;
    if(["verse","note","text","rect"].includes(s.type)){const hs=11*iz;front+=`<rect class="handle" data-handle="1" x="${bb.x+bb.w+p-hs/2}" y="${bb.y+bb.h+p-hs/2}" width="${hs}" height="${hs}" rx="${2*iz}" stroke-width="${1.6*iz}"/>`}
    if(s.type==="arrow"){const m=arrowMid(s);if(m)front+=`<circle class="bendh" data-bend="1" cx="${m.x}" cy="${m.y}" r="${7*iz}" stroke-width="${2*iz}"><title>Tire pour courber la flèche</title></circle>`}}}
  if(drag&&drag.hover){const hb=bbox(el(drag.hover));if(hb){const p=5*iz;front+=`<rect class="hovbox" x="${hb.x-p}" y="${hb.y-p}" width="${hb.w+2*p}" height="${hb.h+2*p}" rx="${10*iz}" vector-effect="non-scaling-stroke"/>`}}
  svgBack.innerHTML=back;svgFront.innerHTML=front;
  $("#emptyBoard").hidden=b.length>0;
  positionSelTools();
}

  renderPalette();
}
function renderPalette(){const s=selId&&el(selId);const forSel=s&&s.type!=="verse";const show=forSel||["pen","rect","arrow","note","text"].includes(tool);const p=$("#palette");p.hidden=!show;if(!show)return;
  const active=forSel?s.color:(tool==="note"?ui.noteColor:ui.color);
  const SB=["rect","arrow","note","text"];const st=forSel?(SB.includes(s.type)?(s.style||"clean"):null):(SB.includes(tool)?(state.style||"clean"):null);
  p.innerHTML=`<small>${forSel?"Couleur de l'élément":"Couleur"}</small>`+Object.entries(COLORS).map(([k,n])=>`<button class="dotbtn" data-color="${k}" style="--dc:var(--c-${k})" title="${n}" aria-label="Couleur ${n}" aria-pressed="${active===k}"></button>`).join("")+
  (st?`<span class="psep"></span><small>Style</small><div class="segm sm" role="group" aria-label="Style du trait"><button data-style="clean" aria-pressed="${st==="clean"}">Net</button><button data-style="hand" aria-pressed="${st==="hand"}">Main levée</button></div>`:"")}
let hintT;function flashHint(key,ms=3800){const h=$("#toolhint");h.innerHTML=HINTS[key];h.hidden=false;clearTimeout(hintT);hintT=setTimeout(()=>h.hidden=true,ms)}
function setTool(t,quiet){const changed=tool!==t;tool=t;stage.className="t-"+t;if(t!=="select")select(null);renderToolbar();if(changed&&!quiet)flashHint(t)}

/* ---------- Sélection ---------- */
function select(id){selId=id;const e=id&&el(id);if(e&&e.type==="verse"&&ui.selVerse!==e.ref){ui.selVerse=e.ref;renderReader();if(isDrawer("tafsir"))renderSide()}renderPalette();renderBoard()}
function positionSelTools(){const box=$("#seltools");const e=selId&&el(selId);if(!e||drag||editingId){box.hidden=true;return}
  const b=bbox(e);if(!b){box.hidden=true;return}
  let html="";
  if(e.type==="verse")html+=`<button data-st="show">Voir le texte</button><button data-st="reflect">Réflexion</button>`;
  if(e.type==="note"||e.type==="text")html+=`<button data-st="edit">Écrire</button>`;
  if(e.type==="arrow"&&e.bend)html+=`<button data-st="straight">Redresser</button>`;
  html+=`<button data-st="comment">Commenter</button>`;
  if(e.type!=="arrow"&&e.type!=="verse")html+=`<button data-st="dup">Dupliquer</button>`;
  html+=`<button data-st="del" class="danger">Supprimer</button>`;
  box.innerHTML=html;box.hidden=false;
  let x=cam.x+(b.x+b.w/2)*cam.z,y=cam.y+b.y*cam.z-12;const r=stage.getBoundingClientRect();
  if(y<box.offsetHeight+10){y=cam.y+(b.y+b.h)*cam.z+12+box.offsetHeight}
  x=clamp(x,box.offsetWidth/2+8,r.width-box.offsetWidth/2-8);
  box.style.left=x+"px";box.style.top=y+"px";
}
$("#seltools").addEventListener("pointerdown",e=>e.stopPropagation());
$("#seltools").addEventListener("click",e=>{const a=e.target.closest("[data-st]")?.dataset.st;const t=el(selId);if(!a||!t)return;
  if(a==="del")removeEl(t.id);
  if(a==="dup"){checkpoint();const c=JSON.parse(JSON.stringify(t));c.id=uid();c.x+=28;c.y+=28;board().push(c);save();select(c.id)}
  if(a==="comment")startComment({kind:"el",id:t.id});
  if(a==="edit")startEdit(t.id);
  if(a==="straight"){checkpoint();t.bend=0;save();renderBoard()}
  if(a==="show")gotoVerse(t.ref);
  if(a==="reflect")addReflection(t.ref);
});
function removeEl(id){checkpoint();state.boards[state.current]=board().filter(e=>e.id!==id&&!(e.type==="arrow"&&(e.from.id===id||e.to.id===id)));selId=null;save();renderBoard();renderReader();renderPalette();toast("Élément supprimé",{label:"Annuler",fn:undo})}

/* ---------- Édition de texte ---------- */
function startEdit(id){const e=el(id);if(!e||!["note","text"].includes(e.type))return;
  editingId=null;selId=id;renderBoard();editingId=id;positionSelTools();
  const n=els.querySelector(`[data-id="${id}"] .editable`);n.contentEditable="true";n.focus();
  const r=document.createRange();r.selectNodeContents(n);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r);
  n.addEventListener("keydown",ev=>{ev.stopPropagation();if(ev.key==="Escape"||(ev.key==="Enter"&&(ev.metaKey||ev.ctrlKey))){ev.preventDefault();n.blur()}});
  n.addEventListener("blur",()=>{const t=el(id);editingId=null;if(t){const txt=n.innerText.replace(/\n+$/,"").trim();if(txt!==t.text){checkpoint();t.text=txt}if(!txt){state.boards[state.current]=board().filter(x=>x.id!==id&&!(x.type==="arrow"&&(x.from.id===id||x.to.id===id)));selId=null}}save();renderBoard()},{once:true});
}

/* ---------- Création ---------- */
function addVerseCard(ref,at,silent,mode){mode=mode||"read";const ex=board().find(e=>e.type==="verse"&&e.ref===ref&&(e.mode||"read")===mode);
  if(ex){if(!silent){select(ex.id);centerOn(bbox(ex),true);renderBoard();toast(`${ref} est déjà sur le tableau`)}return ex}
  checkpoint();const p=at||viewCenter();const c={id:uid(),type:"verse",ref,x:p.x-170,y:p.y-60,w:mode==="wbw"?440:340};if(mode==="wbw")c.mode="wbw";board().push(c);save();renderBoard();renderReader();
  if(!silent){select(c.id);centerOn(bbox(c),true);renderBoard();toast(`Verset ${ref} ajouté au tableau`)}return c}
function addReflection(ref){if(isMobile())setPane("board");
  const card=addVerseCard(ref,null,true);const b=bbox(card);checkpoint();
  const n={id:uid(),type:"note",x:b.x+b.w+70,y:b.y,w:260,color:ui.noteColor,by:"me",text:"",style:state.style||"clean"};board().push(n);
  board().push({id:uid(),type:"arrow",from:{id:card.id},to:{id:n.id},color:ui.noteColor,style:state.style||"clean"});save();renderBoard();
  centerOn({x:b.x,y:b.y,w:b.w+330,h:b.h},true);renderBoard();setTool("select",true);startEdit(n.id)}
function bindable(id){const e=el(id);return e&&["verse","note","text","rect"].includes(e.type)}

/* ---------- Interactions du tableau ---------- */
stage.addEventListener("pointerdown",e=>{
  if(e.target.closest(".dock,.corner,#seltools"))return;
  if(editingId){if(e.target.closest('[contenteditable="true"]'))return;document.activeElement&&document.activeElement.blur()}
  const w=toWorld(e.clientX,e.clientY);const tid=e.target.closest("[data-id]")?.dataset.id;const handle=e.target.closest("[data-handle]");
  stage.setPointerCapture(e.pointerId);
  if(e.button===1||tool==="hand"||spaceDown){drag={kind:"pan",sx:e.clientX,sy:e.clientY,ox:cam.x,oy:cam.y};stage.classList.add("panning");positionSelTools();return}
  if(e.button!==0)return;
  if(tool==="select"){
    if(e.target.closest("[data-bend]")&&selId){drag={kind:"bend",id:selId,cp:false};positionSelTools();return}
    if(handle&&selId){const t=el(selId);const b=bbox(t);drag={kind:"resize",id:selId,start:w,ow:t.type==="rect"?t.w:b.w,oh:t.h,cp:false};return}
    if(tid){if(selId!==tid)select(tid);drag={kind:"move",id:tid,start:w,orig:JSON.parse(JSON.stringify(el(tid))),cp:false};return}
    if(selId)select(null);drag={kind:"pan",sx:e.clientX,sy:e.clientY,ox:cam.x,oy:cam.y};stage.classList.add("panning");return}
  if(tool==="note"||tool==="text"){checkpoint();const n=tool==="note"?{id:uid(),type:"note",x:w.x-20,y:w.y-20,w:260,color:ui.noteColor,by:"me",text:"",style:state.style||"clean"}:{id:uid(),type:"text",x:w.x,y:w.y-14,w:320,size:"md",color:ui.color,text:"",style:state.style||"clean"};
    board().push(n);setTool("select",true);setTimeout(()=>startEdit(n.id),0);return}
  checkpoint();
  if(tool==="pen"){const n={id:uid(),type:"stroke",x:w.x,y:w.y,points:[[0,0]],color:ui.color,by:"me"};board().push(n);drag={kind:"pen",id:n.id}}
  if(tool==="rect"){const n={id:uid(),type:"rect",x:w.x,y:w.y,w:0,h:0,color:ui.color,style:state.style||"clean"};board().push(n);drag={kind:"rect",id:n.id,sx:w.x,sy:w.y}}
  if(tool==="arrow"){const from=tid&&bindable(tid)?{id:tid}:{x:w.x,y:w.y};const n={id:uid(),type:"arrow",from,to:{x:w.x,y:w.y},color:ui.color,style:state.style||"clean"};board().push(n);drag={kind:"arrow",id:n.id}}
  $("#toolhint").hidden=true;renderBoard();
});
stage.addEventListener("pointermove",e=>{if(!drag)return;const w=toWorld(e.clientX,e.clientY);const t=drag.id&&el(drag.id);
  switch(drag.kind){
    case"pan":cam.x=drag.ox+e.clientX-drag.sx;cam.y=drag.oy+e.clientY-drag.sy;applyCam();return;
    case"move":{const dx=w.x-drag.start.x,dy=w.y-drag.start.y;if(!drag.cp){if(Math.hypot(dx,dy)*cam.z<3)return;checkpoint();drag.cp=true;positionSelTools()}const o=drag.orig;
      if(t.type==="arrow"){if(!o.from.id)t.from={x:o.from.x+dx,y:o.from.y+dy};if(!o.to.id)t.to={x:o.to.x+dx,y:o.to.y+dy}}else{t.x=o.x+dx;t.y=o.y+dy}break}
    case"resize":{if(!drag.cp){checkpoint();drag.cp=true}const dx=w.x-drag.start.x,dy=w.y-drag.start.y;t.w=Math.max(t.type==="rect"?30:180,drag.ow+dx);if(t.type==="rect")t.h=Math.max(30,drag.oh+dy);break}
    case"bend":{if(!drag.cp){checkpoint();drag.cp=true}const p=arrowPts({...t,bend:0});if(!p)break;const m={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2},n=p[3];let b=Math.round((w.x-m.x)*n.x+(w.y-m.y)*n.y);t.bend=Math.abs(b)<6?0:b;break}
    case"pen":{const l=t.points[t.points.length-1];const p=[w.x-t.x,w.y-t.y];if(Math.hypot(p[0]-l[0],p[1]-l[1])>1.5/cam.z)t.points.push(p);break}
    case"rect":t.x=Math.min(drag.sx,w.x);t.y=Math.min(drag.sy,w.y);t.w=Math.abs(w.x-drag.sx);t.h=Math.abs(w.y-drag.sy);break;
    case"arrow":{t.to={x:w.x,y:w.y};drag.hover=null;for(const n of document.elementsFromPoint(e.clientX,e.clientY)){const id=n.closest&&n.closest("[data-id]")?.dataset.id;if(id&&id!==t.id&&id!==t.from.id&&bindable(id)){drag.hover=id;break}}break}
  }
  renderBoard();
});
function endDrag(){if(!drag)return;const t=drag.id&&el(drag.id);const k=drag.kind;
  if(k==="pen"&&t&&t.points.length<2){board().splice(board().indexOf(t),1);undoStack.pop()}
  if(k==="rect"&&t){if(t.w<8||t.h<8){board().splice(board().indexOf(t),1);undoStack.pop()}else{drag=null;setTool("select",true);select(t.id)}}
  if(k==="arrow"&&t){if(drag&&drag.hover)t.to={id:drag.hover};const p=arrowPts(t);if(!p||Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y)<12){board().splice(board().indexOf(t),1);undoStack.pop()}else{drag=null;setTool("select",true);select(t.id)}}
  drag=null;stage.classList.remove("panning");save();updUndo();renderBoard();if(k==="move"||k==="resize")renderReader()}
stage.addEventListener("pointerup",endDrag);stage.addEventListener("pointercancel",endDrag);
stage.addEventListener("dblclick",e=>{if(e.target.closest(".dock,.corner,#seltools"))return;const id=e.target.closest("[data-id]")?.dataset.id;const t=id&&el(id);
  if(t&&(t.type==="note"||t.type==="text")){startEdit(id);return}
  if(t&&t.type==="verse"){gotoVerse(t.ref);return}
  if(!t&&tool==="select"){const w=toWorld(e.clientX,e.clientY);checkpoint();const n={id:uid(),type:"note",x:w.x-20,y:w.y-20,w:260,color:ui.noteColor,by:"me",text:"",style:state.style||"clean"};board().push(n);startEdit(n.id)}});
stage.addEventListener("wheel",e=>{if(e.target.closest(".dock"))return;e.preventDefault();const r=stage.getBoundingClientRect();
  if(e.ctrlKey||e.metaKey)zoomAt(e.clientX-r.left,e.clientY-r.top,cam.z*Math.exp(-e.deltaY*.01));else{cam.x-=e.deltaX;cam.y-=e.deltaY;applyCam()}},{passive:false});
stage.addEventListener("dragover",e=>{if([...e.dataTransfer.types].includes("text/x-verse")){e.preventDefault();stage.classList.add("drop")}});
stage.addEventListener("dragleave",()=>stage.classList.remove("drop"));

$("#toolbar").addEventListener("click",e=>{const tb=e.target.closest("[data-tool]");if(tb)setTool(tb.dataset.tool)});
$("#palette").addEventListener("click",e=>{const sv=e.target.closest("[data-style]")?.dataset.style;if(sv){const s=selId&&el(selId);state.style=sv;if(s&&["rect","arrow","note","text"].includes(s.type)){checkpoint();s.style=sv;renderBoard()}save();renderPalette();return}
  const c=e.target.closest("[data-color]")?.dataset.color;if(!c)return;const s=selId&&el(selId);
  if(s&&s.type!=="verse"){checkpoint();s.color=c;if(s.type==="note")ui.noteColor=c;else ui.color=c;save();renderBoard()}else if(tool==="note")ui.noteColor=c;else ui.color=c;renderPalette()});

function renderSurahSel(){$("#surahSel").innerHTML=Object.entries(SURAHS).map(([n,S])=>`<option value="${n}">${n}. ${S.name} — ${S.fr}</option>`).join("");$("#surahSel").value=cur().surah}
function renderReader(){const rb=$("#readerBody");const ae=document.activeElement;let keep=null;
  if(ae&&rb.contains(ae)&&ae.matches("input")){keep={sel:ae.dataset.free?`[data-free="${ae.dataset.free}"]`:`.wi[data-ref="${ae.dataset.ref}"][data-i="${ae.dataset.i}"]`,s:ae.selectionStart,e:ae.selectionEnd}}
  document.body.classList.toggle("wbw",state.readMode==="wbw");renderModebar();
  if(state.readMode==="wbw")renderWbw();else renderRead();
  if(keep){const n=rb.querySelector(keep.sel);if(n){n.focus({preventScroll:true});try{n.setSelectionRange(keep.s,keep.e)}catch(_){}}}}

  $("#modebar").innerHTML=`<div class="segm" role="group" aria-label="Mode de lecture"><button data-mode="read" aria-pressed="${!w}">Traduction</button><button data-mode="wbw" aria-pressed="${w}">Mot à mot</button></div>`+
  (w?`<div class="chars"><small>Insérer</small>${["à","é","ë","ó","ñ","ŋ"].map(c=>`<button type="button" data-ch="${c}" title="Insérer ${c}" aria-label="Insérer ${c}">${c}</button>`).join("")}</div>`:"")}
function renderRead(){
  const s=cur().surah,S=SURAHS[s],h=hls();const on=new Set(board().filter(e=>e.type==="verse").map(e=>e.ref));
  let out=`<div class="surah-head"><div class="ar" lang="ar">سورة ${S.ar}</div><div class="sub">${S.name} · ${S.fr} · ${S.verses.length} versets</div></div>`;
  if(S.bism)out+=`<div class="bism" lang="ar">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`;

  const tv=e.target.closest("[data-tv]");if(tv){tv.dataset.tv==="reflect"?(closeDrawer(),addReflection(ui.selVerse)):startComment({kind:"verse",ref:ui.selVerse});return}
  const th=e.target.closest(".thread");if(!th)return;const c=state.comments.find(x=>x.id===th.dataset.cid);
  if(e.target.closest("[data-goto]")){const a=c.anchor;if(!a)return;if(isMobile())closeDrawer();if(a.kind==="verse")gotoVerse(a.ref);else if(a.kind==="word")goWord(a.ref,a.i);else{const t=el(a.id);if(!t){toast("Cet élément a été supprimé");return}if(isMobile())setPane("board");requestAnimationFrame(()=>{setTool("select",true);select(t.id);centerOn(bbox(t),true);renderBoard()})}return}
  if(e.target.closest("[data-reply]")){ui.replyTo=c.id;ui.replyDraft="";renderSide();setTimeout(()=>$("#replyIn")?.focus(),20);return}
  if(e.target.closest("[data-rcancel]")){ui.replyTo=null;renderSide();return}
  if(e.target.closest("[data-rsend]")){sendReply(c);return}
  if(e.target.closest("[data-resolve]")){c.resolved=!c.resolved;save();renderSide();renderDiscBtn();toast(c.resolved?"Fil marqué comme résolu":"Fil rouvert")}
});
$("#sideBody").addEventListener("input",e=>{if(e.target.id==="glossQ"){ui.glossQ=e.target.value;renderGlossList();return}if(e.target.id==="replyIn"){ui.replyDraft=e.target.value;mentionAuto(e.target)}});
$("#sideBody").addEventListener("keydown",e=>{if(e.target.id==="replyIn"){if(mentionKey(e))return;if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();sendReply(state.comments.find(x=>x.id===ui.replyTo))}}});
function sendReply(c){const t=ui.replyDraft.trim();if(!t)return;c.replies.push({author:"me",text:t,ts:Date.now()});ui.replyTo=null;ui.replyDraft="";$("#mpop").hidden=true;save();renderSide();toast("Réponse publiée");maybeKReply(t,c)}
$("#ctx").addEventListener("click",e=>{if(e.target.id==="ctxClear"){ui.anchor=null;renderCtx()}});
$("#composer").addEventListener("submit",e=>{e.preventDefault();const inp=$("#cmtInput");const t=inp.value.trim();if(!t){inp.focus();return}
  const c={id:uid(),sid:state.current,anchor:ui.anchor,author:"me",text:t,ts:Date.now(),resolved:false,replies:[]};state.comments.push(c);inp.value="";ui.anchor=null;ui.filter="open";$("#mpop").hidden=true;save();renderSide();renderReader();renderBoard();renderDiscBtn();toast("Commentaire publié");maybeKReply(t,c)});
$("#cmtInput").addEventListener("input",e=>mentionAuto(e.target));
$("#cmtInput").addEventListener("keydown",e=>{if(mentionKey(e))return;if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();$("#composer").requestSubmit()}});

/* Mentions @ */
let mTarget=null,mIdx=0,mList=[];
function mentionAuto(ta){const before=ta.value.slice(0,ta.selectionStart);const m=before.match(/@(\w*)$/);const pop=$("#mpop");
  if(!m){pop.hidden=true;mTarget=null;return}mTarget=ta;mList=Object.values(MEMBERS).filter(p=>p.name.toLowerCase().startsWith(m[1].toLowerCase()));if(!mList.length){pop.hidden=true;return}mIdx=0;drawPop();
  const r=ta.getBoundingClientRect(),dr=$("#drawer").getBoundingClientRect();pop.style.top="auto";pop.style.bottom=(dr.bottom-r.top+4)+"px";if(pop.parentElement!==$("#drawer"))$("#drawer").appendChild(pop);pop.hidden=false}
function drawPop(){$("#mpop").innerHTML=mList.map((p,i)=>`<button type="button" data-mi="${i}" class="${i===mIdx?"act":""}"><span class="av" style="--c:${p.c}">${p.init}</span>${p.name}</button>`).join("")}
function pickMention(i){const p=mList[i],ta=mTarget;if(!p||!ta)return;const pos=ta.selectionStart;const before=ta.value.slice(0,pos).replace(/@(\w*)$/,"@"+p.name+" ");ta.value=before+ta.value.slice(pos);ta.focus();ta.selectionStart=ta.selectionEnd=before.length;if(ta.id==="replyIn")ui.replyDraft=ta.value;$("#mpop").hidden=true;mTarget=null}
function mentionKey(e){if($("#mpop").hidden||e.target!==mTarget)return false;if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();mIdx=(mIdx+(e.key==="ArrowDown"?1:mList.length-1))%mList.length;drawPop();return true}if(e.key==="Enter"||e.key==="Tab"){e.preventDefault();pickMention(mIdx);return true}if(e.key==="Escape"){$("#mpop").hidden=true;return true}return false}
$("#mpop").addEventListener("mousedown",e=>{e.preventDefault();const b=e.target.closest("[data-mi]");if(b)pickMention(+b.dataset.mi)});

/* ---------- Présence simulée (démo) ---------- */
function kMove(){if(document.hidden)return;const c=board().filter(e=>e.type==="verse"||e.type==="note");if(!c.length)return;const t=c[Math.floor(Math.random()*c.length)];const b=bbox(t);
  $("#kcursor").style.transform=`translate(${b.x+b.w*(.3+Math.random()*.5)}px,${b.y+b.h*(.3+Math.random()*.5)}px)`;
  ui.kRef=t.type==="verse"?t.ref:null;document.querySelectorAll(".verse").forEach(li=>li.classList.toggle("k-here",li.dataset.ref===ui.kRef))}
function kComment(){if(state.demoDone||state.current!=="s-duha")return;state.demoDone=true;
  const c={id:"c-demo",sid:"s-duha",anchor:{kind:"verse",ref:"93:11"},author:"k",text:"@Toi pour le 93:11, « proclamer le bienfait » : est-ce que ça inclut aussi le partager concrètement avec les autres ? Ça boucle avec les versets 9 et 10.",ts:Date.now(),resolved:false,replies:[]};
  state.comments.push(c);save();if(isDrawer("discussion"))renderSide();renderReader();renderBoard();renderDiscBtn();
  toast("Khadija t'a mentionné sur 93:11",{label:"Voir",fn:()=>{ui.filter="mentions";state.readMentions.push("c-demo:0");save();openDrawer("discussion");requestAnimationFrame(()=>{const th=$(`.thread[data-cid="c-demo"]`);th&&(th.classList.add("flash"),th.scrollIntoView({block:"nearest"}))})}})}
function maybeKReply(t,c){if(!/@Khadija\b/.test(t))return;setTimeout(()=>{c.replies.push({author:"k",text:"Bien reçu @Toi, je regarde ça et je complète sur le tableau.",ts:Date.now()});save();if(c.sid===state.current&&isDrawer("discussion"))renderSide();renderDiscBtn();toast("Khadija a répondu",{label:"Voir",fn:()=>openDrawer("discussion")})},5000)}

/* ---------- Séances, partage, options ---------- */
function renderHeader(){$("#sessTitle").value=cur().title}
$("#sessTitle").addEventListener("change",e=>{cur().title=e.target.value.trim()||"Séance sans titre";save();renderHeader()});
$("#sessTitle").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.blur();e.stopPropagation()});
$("#sessBtn").setAttribute("data-menu-btn","");$("#moreBtn").setAttribute("data-menu-btn","");$("#readerMore").setAttribute("data-menu-btn","");
$("#sessBtn").onclick=e=>{const df=new Intl.DateTimeFormat("fr",{day:"numeric",month:"long"});
  popMenu(e.currentTarget,`<div class="mh2">Séances de l'espace</div>`+Object.values(state.sessions).sort((a,b)=>b.date-a.date).map(s=>`<button class="mi ${s.id===state.current?"cur":""}" data-k="s:${s.id}"><span>${esc(s.title)}</span><small>${df.format(s.date)} · ${SURAHS[s.surah].name}</small></button>`).join("")+`<hr><button class="mi" data-k="new"><span>+ Nouvelle séance</span><small>Un tableau vide</small></button>`,
  k=>{if(k.startsWith("s:"))switchSession(k.slice(2));if(k==="new"){const id="s-"+uid();state.sessions[id]={id,title:"Nouvelle séance",surah:cur().surah,date:Date.now()};state.boards[id]=[];state.highlights[id]={};switchSession(id);$("#sessTitle").select();toast("Séance créée — donne-lui un titre")}},"left")};
function switchSession(id){state.current=id;selId=null;editingId=null;ui.selVerse=null;ui.anchor=null;ui.replyTo=null;undoStack=[];redoStack=[];save();renderHeader();renderSurahSel();renderReader();if(document.body.classList.contains("drawer-open"))renderSide();renderPalette();updUndo();renderBoard();renderDiscBtn();requestAnimationFrame(fitView)}
function modal(html){closeMenus();const s=document.createElement("div");s.className="scrim";s.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}<div class="mfoot"><button class="btn primary" data-close>Fermer</button></div></div>`;s.onclick=e=>{if(e.target===s||e.target.closest("[data-close]"))s.remove()};document.body.appendChild(s);s.querySelector("[data-close]").focus();return s}
$("#shareBtn").onclick=()=>{const s=modal(`<h3>Inviter dans l'espace</h3><p class="sub">Les membres voient le tableau, les surlignages, le wolof et la discussion en direct, et peuvent être mentionnés avec @.</p>
  <div class="member"><span class="av" style="--c:var(--me)">T</span><div class="grow"><b>Toi</b><br><small>Propriétaire</small></div><small>En ligne</small></div>
  <div class="member"><span class="av" style="--c:var(--k)">K</span><div class="grow"><b>Khadija</b><br><small>Peut modifier</small></div><small>En ligne</small></div>
  <div class="copyrow"><input id="invLink" readonly value="majalis.app/rejoindre/ad-duha-7k2q" aria-label="Lien d'invitation"><button class="btn" id="copyInv">Copier le lien</button></div>
  <p class="note-demo">Prototype : la présence de Khadija et ses commentaires sont simulés. La synchronisation en temps réel entre deux comptes arrive à l'étape suivante.</p>`);
  s.querySelector("#copyInv").onclick=()=>{const i=s.querySelector("#invLink");const fb=()=>{i.select();toast("Sélectionné — copie avec Ctrl+C")};navigator.clipboard?navigator.clipboard.writeText(i.value).then(()=>toast("Lien copié"),fb):fb()}};
function showKeys(){modal(`<h3>Raccourcis</h3><p class="sub">Chaque outil a aussi son bouton : les raccourcis ne sont qu'un bonus.</p><div class="keys">
  ${TOOLS.filter(t=>!t.sep).map(t=>`<kbd class="k">${t.key}</kbd><span>${t.label}</span>`).join("")}
  <kbd class="k">Espace + glisser</kbd><span>Se déplacer dans le tableau</span><kbd class="k">Ctrl + molette</kbd><span>Zoomer</span>
  <kbd class="k">Suppr</kbd><span>Supprimer la sélection</span><kbd class="k">Ctrl + Z</kbd><span>Annuler</span><kbd class="k">Ctrl + Maj + Z</kbd><span>Rétablir</span>
  <kbd class="k">Échap</kbd><span>Revenir à la sélection, ou fermer</span><kbd class="k">Double-clic</kbd><span>Écrire dans une note, ou en créer une</span></div>`)}
$("#moreBtn").onclick=e=>popMenu(e.currentTarget,`<button class="mi" data-k="keys"><span>Raccourcis clavier</span></button><button class="mi" data-k="reset"><span>Réinitialiser la démo</span><small>Efface tes changements dans ce navigateur</small></button>`,
  k=>{if(k==="keys")showKeys();if(k==="reset"){state=seed();save();closeDrawer();switchSession(state.current);toast("Démo réinitialisée")}},"right");
document.querySelector(".mobnav").addEventListener("click",e=>{const b=e.target.closest("[data-pane]");if(b)setPane(b.dataset.pane)});

/* ---------- Clavier ---------- */
document.addEventListener("keydown",e=>{const tg=e.target;if(tg.closest&&(tg.closest("input,textarea,select,[contenteditable='true']")))return;
  if(e.key==="Escape"){if($(".scrim,.menu")){closeMenus();return}if(document.body.classList.contains("drawer-open")&&!selId&&tool==="select"){closeDrawer();return}if(tool!=="select")setTool("select",true);else select(null);return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();e.shiftKey?redo():undo();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){e.preventDefault();redo();return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key===" "){spaceDown=true;stage.classList.add("panning");e.preventDefault();return}
  if((e.key==="Delete"||e.key==="Backspace")&&selId){e.preventDefault();removeEl(selId);return}
  if(e.key==="Enter"&&selId){const t=el(selId);if(t&&(t.type==="note"||t.type==="text")){e.preventDefault();startEdit(selId)}return}
  if(e.key==="?"){showKeys();return}
  const t=TOOLS.find(x=>x.key&&x.key.toLowerCase()===e.key.toLowerCase());if(t)setTool(t.id)});
document.addEventListener("keyup",e=>{if(e.key===" "){spaceDown=false;if(!drag)stage.classList.remove("panning")}});
addEventListener("resize",()=>positionSelTools());

/* ---------- Démarrage ---------- */
setPane("board");
renderHeader();renderSurahSel();renderReader();renderToolbar();setTool("select",true);renderDiscBtn();updUndo();renderBoard();
requestAnimationFrame(()=>{renderBoard();fitView();kMove();flashHint("welcome",6000)});
document.fonts&&document.fonts.ready.then(()=>{renderBoard()});
setInterval(kMove,4500);setTimeout(kComment,15000);
</script>
