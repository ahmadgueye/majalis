<title>Majlis Tadabbur</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Figtree:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap">
<style>
/* Layout: three calm columns — reading (mushaf) · infinite board · discussion. One action = one labelled button. */
:root{
  --bg:#f4f6f4; --surface:#ffffff; --surface-2:#eef2ef; --line:#dce3df; --ink:#15221e; --muted:#5b6a64;
  --accent:#0d5c52; --accent-ink:#ffffff; --accent-soft:#dcebe6; --grid:#d5ddd8;
  --hl-theme:#dcebd3; --hl-question:#d7e7f4; --hl-reflect:#f4e6c3; --hl-link:#f3dbe0;
  --c-ink:#1f2d29; --c-sand:#b07a14; --c-sage:#4a7a45; --c-rose:#ad4259; --c-sky:#2c6b9b;
  --note-ink:#ffffff; --note-sand:#fbf0d2; --note-sage:#e3efdb; --note-rose:#f8e1e6; --note-sky:#dde9f5;
  --me:#0d5c52; --k:#8f45ab; --shadow:0 1px 2px rgba(20,40,34,.06),0 6px 20px rgba(20,40,34,.08);
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --f-ar:"Amiri Quran","Amiri","Geeza Pro","Traditional Arabic",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#161e1b; --surface-2:#1c2622; --line:#2a3631; --ink:#e5ece9; --muted:#97a6a0;
  --accent:#62bcac; --accent-ink:#06201b; --accent-soft:#1c3a34; --grid:#24302b;
  --hl-theme:#27381f; --hl-question:#1d3142; --hl-reflect:#3a311c; --hl-link:#3c2229;
  --c-ink:#e5ece9; --c-sand:#e1b45b; --c-sage:#8cc485; --c-rose:#e68aa0; --c-sky:#80b6e2;
  --note-ink:#1c2622; --note-sand:#373020; --note-sage:#233322; --note-rose:#382229; --note-sky:#1e2e3c;
  --me:#62bcac; --k:#c88be2; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#161e1b; --surface-2:#1c2622; --line:#2a3631; --ink:#e5ece9; --muted:#97a6a0;
  --accent:#62bcac; --accent-ink:#06201b; --accent-soft:#1c3a34; --grid:#24302b;
  --hl-theme:#27381f; --hl-question:#1d3142; --hl-reflect:#3a311c; --hl-link:#3c2229;
  --c-ink:#e5ece9; --c-sand:#e1b45b; --c-sage:#8cc485; --c-rose:#e68aa0; --c-sky:#80b6e2;
  --note-ink:#1c2622; --note-sand:#373020; --note-sage:#233322; --note-rose:#382229; --note-sky:#1e2e3c;
  --me:#62bcac; --k:#c88be2; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;}

/* Header */
header{display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.01em}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-ar);font-size:17px;line-height:1}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.btn svg{width:16px;height:16px;flex:none}
#sessTitle{flex:1;min-width:60px;max-width:420px;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;font:600 15px var(--f-ui);color:var(--ink);text-overflow:ellipsis}
#sessTitle:hover{border-color:var(--line)} #sessTitle:focus{border-color:var(--accent);background:var(--surface)}
.hgroup{display:flex;align-items:center;gap:6px}
.avatars{display:flex;align-items:center}
.av{width:28px;height:28px;border-radius:50%;background:var(--c,var(--accent));color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;border:2px solid var(--surface);position:relative;flex:none}
.avatars .av+.av{margin-left:-6px}
.av .on{position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;background:#3fae62;border:2px solid var(--surface)}
.bell{position:relative}
.bell .count{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--c-rose);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
.live i{width:7px;height:7px;border-radius:50%;background:#3fae62;box-shadow:0 0 0 3px color-mix(in srgb,#3fae62 25%,transparent)}

/* Main grid */
main{display:grid;grid-template-columns:var(--rw,360px) 1fr var(--sw,340px);min-height:0}
body.wbw:not(.no-reader) main{--rw:540px}
body.no-reader main{--rw:0px} body.no-side main{--sw:0px}
body.no-reader #reader, body.no-side #side{display:none}
#reader,#side{background:var(--surface);min-height:0;display:flex;flex-direction:column;min-width:0}
#reader{border-right:1px solid var(--line)} #side{border-left:1px solid var(--line)}
.phead{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.phead label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;flex:1;min-width:0}
.scroll{overflow:auto;min-height:0;flex:1}

/* Reader */
.surah-head{text-align:center;padding:20px 16px 8px}
.surah-head .ar{font-family:var(--f-ar);font-size:30px;line-height:1.6}
.surah-head .sub{color:var(--muted);font-size:13px}
.bism{font-family:var(--f-ar);text-align:center;font-size:22px;padding:4px 0 10px;color:var(--muted)}
.verses{list-style:none;margin:0;padding:4px 10px 20px;display:flex;flex-direction:column;gap:4px}
.verse{border-radius:10px;padding:10px 12px;border:1px solid transparent;cursor:pointer;position:relative}
.verse:hover{background:var(--surface-2)}
.verse.is-sel{border-color:var(--accent);background:var(--surface)}
.verse.hl-theme{background:var(--hl-theme)} .verse.hl-question{background:var(--hl-question)} .verse.hl-reflect{background:var(--hl-reflect)} .verse.hl-link{background:var(--hl-link)}
.vtop{display:flex;align-items:center;gap:6px;min-height:22px}
.vnum{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-variant-numeric:tabular-nums;background:var(--surface)}
.vtags{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.tag,.mini{font-size:11px;font-weight:600;border-radius:5px;padding:1px 6px;display:inline-flex;align-items:center;gap:3px}
.mini{color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.mini svg{width:11px;height:11px}
.tag{background:var(--surface);border:1px solid var(--line)}
.tag::before,.sw::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--hlc);display:inline-block}
.t-theme{--hlc:var(--c-sage)} .t-question{--hlc:var(--c-sky)} .t-reflect{--hlc:var(--c-sand)} .t-link{--hlc:var(--c-rose)}
.verse .ar{font-family:var(--f-ar);font-size:25px;line-height:2;margin:6px 0 2px;text-align:right}
.verse .fr{font-family:var(--f-read);font-size:14.5px;line-height:1.55;margin:0;color:var(--ink)}
.kpres{display:none;width:20px;height:20px;border-radius:50%;background:var(--k);color:#fff;font-size:10px;font-weight:700;place-items:center}
.verse.k-here .kpres{display:grid}
.vactions{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px;cursor:default}
.vactions .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vactions .row>span{font-size:12px;color:var(--muted);font-weight:600;margin-right:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.chip.sw::before{border-radius:50%}
.reader-foot{font-size:12px;color:var(--muted);padding:0 20px 24px;line-height:1.5}

/* Stage */
#stage{position:relative;overflow:hidden;touch-action:none;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1.1px,transparent 1.2px);min-width:0;user-select:none;-webkit-user-select:none}
#stage.t-select{cursor:default} #stage.t-hand,#stage.panning{cursor:grab} #stage.panning{cursor:grabbing}
#stage.t-pen,#stage.t-rect,#stage.t-arrow{cursor:crosshair} #stage.t-note,#stage.t-text{cursor:copy}
#stage.drop{box-shadow:inset 0 0 0 3px var(--accent)}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
.svgl{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.hit{stroke:transparent;fill:none;pointer-events:stroke;cursor:move}
#stage.t-arrow .hit{cursor:crosshair}
.handle{fill:var(--surface);stroke:var(--accent);pointer-events:all;cursor:nwse-resize}
.selbox{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4}
.hovbox{fill:none;stroke:var(--accent);stroke-width:2.5}
#els{position:absolute;left:0;top:0}
.el{position:absolute;cursor:move}
#stage.t-arrow .el{cursor:crosshair}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 14px 12px;border-top:4px solid var(--line)}
.card.hl-theme{border-top-color:var(--c-sage)} .card.hl-question{border-top-color:var(--c-sky)} .card.hl-reflect{border-top-color:var(--c-sand)} .card.hl-link{border-top-color:var(--c-rose)}
.card .vh{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.card .vh .grow{flex:1}
.card .ar{font-family:var(--f-ar);font-size:24px;line-height:1.9;text-align:right;margin:4px 0}
.card .fr{font-family:var(--f-read);font-size:14px;line-height:1.5}
.cbadge{display:inline-flex;align-items:center;gap:3px;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:1px 7px;font-size:11px}
.cbadge svg{width:11px;height:11px}
.note{border-radius:4px 4px 14px 4px;box-shadow:var(--shadow);padding:12px 14px 10px;font-family:var(--f-read);font-size:15px;line-height:1.5;border:1px solid color-mix(in srgb,var(--ink) 8%,transparent)}
.n-ink{background:var(--note-ink)} .n-sand{background:var(--note-sand)} .n-sage{background:var(--note-sage)} .n-rose{background:var(--note-rose)} .n-sky{background:var(--note-sky)}
.editable{white-space:pre-wrap;word-break:break-word;outline:none;min-height:1.5em}
.editable[contenteditable="true"]{cursor:text;user-select:text;-webkit-user-select:text}
.editable:empty::before{content:attr(data-ph);color:var(--muted)}
.nby{display:flex;align-items:center;gap:6px;margin-top:8px;font-family:var(--f-ui);font-size:11.5px;color:var(--muted);font-weight:600}
.nby i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.text{font-weight:700;line-height:1.25;padding:2px 4px}
.text.s-lg{font-size:28px;letter-spacing:-.01em} .text.s-md{font-size:18px}
.tc-ink{color:var(--c-ink)} .tc-sand{color:var(--c-sand)} .tc-sage{color:var(--c-sage)} .tc-rose{color:var(--c-rose)} .tc-sky{color:var(--c-sky)}

/* Toolbar */
.toolbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow);z-index:5;max-width:calc(100% - 24px);overflow-x:auto}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;border-radius:8px;padding:6px 8px 4px;min-width:54px;font-size:11px;font-weight:500;color:var(--muted)}
.tool svg{width:19px;height:19px;color:var(--ink)}
.tool:hover{background:var(--surface-2)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tool[aria-pressed="true"] svg{color:var(--accent-ink)}
.tool kbd{font:inherit;opacity:.65}
.tsep{width:1px;background:var(--line);margin:4px 4px}
.colors{display:flex;align-items:center;gap:4px;padding:0 6px}
.colors .lbl{font-size:11px;color:var(--muted);font-weight:500;margin-right:2px}
.dotbtn{width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);background:var(--dc);box-shadow:0 0 0 1px var(--line);padding:0}
.dotbtn[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.hintbar{position:absolute;left:12px;bottom:12px;max-width:min(560px,calc(100% - 210px));background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--muted);line-height:1.45;box-shadow:var(--shadow);z-index:4}
.hintbar b{color:var(--ink);font-weight:600}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:var(--shadow);z-index:4}
.zoom button{border:0;background:transparent;border-radius:7px;padding:5px 9px;font-weight:600;font-variant-numeric:tabular-nums}
.zoom button:hover{background:var(--surface-2)}
.undo{position:absolute;left:12px;top:12px;display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:var(--shadow);z-index:5}
.undo button{border:0;background:transparent;border-radius:7px;padding:5px 8px;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500}
.undo button:hover:not(:disabled){background:var(--surface-2)} .undo button:disabled{opacity:.4;cursor:default}
.undo svg{width:16px;height:16px}
#seltools{position:absolute;z-index:6;display:flex;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 16px);gap:2px;background:var(--ink);color:var(--bg);border-radius:10px;padding:3px;box-shadow:var(--shadow);transform:translate(-50%,-100%);}
#seltools button{white-space:nowrap;border:0;background:transparent;color:inherit;border-radius:7px;padding:6px 10px;font-size:12.5px;font-weight:600}
#seltools button:hover{background:color-mix(in srgb,var(--bg) 18%,transparent)}
#seltools button.danger{color:var(--c-rose)}
.empty-board{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;color:var(--muted);padding:24px}
.empty-board b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
#kcursor{position:absolute;left:0;top:0;pointer-events:none;transition:transform 1.6s cubic-bezier(.4,0,.2,1);z-index:3}
#kcursor .inner{transform:scale(var(--iz,1));transform-origin:0 0;display:flex;align-items:flex-start}
#kcursor svg{width:20px;height:20px;color:var(--k)}
#kcursor span{background:var(--k);color:#fff;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;margin:14px 0 0 -4px}

/* Side */
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:8px 10px 10px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-size:11px;background:var(--surface-2);border-radius:999px;padding:0 6px;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:4px;padding:10px 12px 4px;flex-wrap:wrap}
.threads{display:flex;flex-direction:column;gap:10px;padding:8px 12px 16px}
.thread{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.thread.resolved{opacity:.7}
.thread.flash{animation:flash 1.2s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.anchor-chip{border:0;background:var(--surface-2);border-radius:6px;padding:3px 8px;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.anchor-chip:hover{color:var(--ink)}
.msg{display:flex;gap:8px;margin-top:6px}
.msg .av{width:24px;height:24px;font-size:11px;border:0}
.msg .body{min-width:0;flex:1}
.mh{display:flex;gap:6px;align-items:baseline;font-size:12.5px}
.mh time{color:var(--muted);font-size:11.5px}
.msg p{margin:2px 0 0;line-height:1.5;word-break:break-word}
.reply{margin-left:32px}
.mention{color:var(--accent);font-weight:600;background:var(--accent-soft);border-radius:4px;padding:0 3px}
.tactions{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.link{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:3px 6px;border-radius:6px}
.link:hover{background:var(--surface-2);color:var(--ink)}
.replybox{display:flex;gap:6px;margin-top:8px}
textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:none;width:100%;line-height:1.45}
textarea:focus{outline:none;border-color:var(--accent)}
.composer{border-top:1px solid var(--line);padding:10px 12px 12px;position:relative;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.composer .crow{display:flex;align-items:center;gap:8px}
.composer .crow small{flex:1;color:var(--muted);font-size:11.5px}
.ctx{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.ctx b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx button{border:0;background:var(--surface-2);border-radius:6px;padding:1px 7px;font-size:12px}
.mpop{position:absolute;left:12px;bottom:calc(100% - 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;min-width:180px;z-index:10}
.mpop button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:6px 8px;border-radius:7px;text-align:left}
.mpop button:hover,.mpop button.act{background:var(--surface-2)}
.mpop .av{width:22px;height:22px;font-size:10px;border:0}
.empty{color:var(--muted);text-align:center;padding:28px 18px;line-height:1.5}
.pad{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.tafsir-v{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tafsir-v .ar{font-family:var(--f-ar);font-size:22px;line-height:1.9;text-align:right}
.tafsir-v .fr{font-family:var(--f-read);font-size:14px;line-height:1.5}
.sources{display:flex;gap:6px;flex-wrap:wrap}
.placeholder{border:1px dashed var(--line);border-radius:12px;padding:14px;color:var(--muted);line-height:1.55;font-family:var(--f-read)}
.placeholder b{color:var(--ink);font-family:var(--f-ui)}
.legend{display:flex;flex-direction:column;gap:14px}
.legend h4{margin:0;display:flex;align-items:center;gap:8px;font-size:13.5px}
.legend h4 .sq{width:12px;height:12px;border-radius:3px;background:var(--hlc)}
.legend p{margin:2px 0 6px;color:var(--muted);font-size:12.5px}
.legend .refs{display:flex;gap:4px;flex-wrap:wrap}
.legend .refs button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* ---------- Historique ---------- */
function checkpoint(){undoStack.push(JSON.stringify(board()));if(undoStack.length>100)undoStack.shift();redoStack=[];updUndo()}

/* ---------- Géométrie ---------- */
const stage=$("#stage"),world=$("#world"),svgBack=$("#svgBack"),svgFront=$("#svgFront"),els=$("#els");
function toWorld(cx,cy){const r=stage.getBoundingClientRect();return{x:(cx-r.left-cam.x)/cam.z,y:(cy-r.top-cam.y)/cam.z}}
function bbox(e){
  if(!e)return null;
  if(e.type==="rect")return{x:Math.min(e.x,e.x+e.w),y:Math.min(e.y,e.y+e.h),w:Math.abs(e.w),h:Math.abs(e.h)};
  if(e.type==="stroke"){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const[px,py]of e.points){a=Math.min(a,px);b=Math.min(b,py);c=Math.max(c,px);d=Math.max(d,py)}return{x:e.x+a,y:e.y+b,w:c-a,h:d-b}}
  if(e.type==="arrow"){const p=arrowPts(e);if(!p)return null;const[p1,p2]=p;return{x:Math.min(p1.x,p2.x),y:Math.min(p1.y,p2.y),w:Math.abs(p2.x-p1.x),h:Math.abs(p2.y-p1.y)}}
  const s=sizes[e.id]||{w:e.w||260,h:140};return{x:e.x,y:e.y,w:s.w,h:s.h};
}
const center=b=>({x:b.x+b.w/2,y:b.y+b.h/2});
function edgeTo(b,t,gap=8){const c=center(b);const dx=t.x-c.x,dy=t.y-c.y;if(!dx&&!dy)return c;const s=Math.min(dx?(b.w/2+gap)/Math.abs(dx):1e9,dy?(b.h/2+gap)/Math.abs(dy):1e9);return{x:c.x+dx*s,y:c.y+dy*s}}
function endCenter(end){if(end.id){const t=el(end.id);if(!t)return null;return center(bbox(t))}return end}
function arrowPts(a){const c1=endCenter(a.from),c2=endCenter(a.to);if(!c1||!c2)return null;const p1=a.from.id?edgeTo(bbox(el(a.from.id)),c2):c1;const p2=a.to.id?edgeTo(bbox(el(a.to.id)),c1):c2;return[p1,p2]}
function pathD(pts,ox,oy){if(pts.length<3)return pts.map((p,i)=>`${i?"L":"M"}${p[0]+ox} ${p[1]+oy}`).join("");let d=`M${pts[0][0]+ox} ${pts[0][1]+oy}`;for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2+ox,my=(pts[i][1]+pts[i+1][1])/2+oy;d+=`Q${pts[i][0]+ox} ${pts[i][1]+oy} ${mx} ${my}`}const l=pts[pts.length-1];return d+`L${l[0]+ox} ${l[1]+oy}`}

/* ---------- Caméra ---------- */
function applyCam(){world.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;world.style.setProperty("--iz",1/cam.z);stage.style.backgroundSize=`${24*cam.z}px ${24*cam.z}px`;stage.style.backgroundPosition=`${cam.x}px ${cam.y}px`;$("#zPct").textContent=Math.round(cam.z*100)+" %";positionSelTools()}
function zoomAt(px,py,nz){nz=clamp(nz,.2,3);cam.x=px-(px-cam.x)*nz/cam.z;cam.y=py-(py-cam.y)*nz/cam.z;cam.z=nz;applyCam();renderBoard()}
function zoomCenter(f){const r=stage.getBoundingClientRect();zoomAt(r.width/2,r.height/2,cam.z*f)}
function fitView(){const b=board();const r=stage.getBoundingClientRect();if(!r.width)return;if(!b.length){cam={x:r.width/2,y:r.height/2,z:1};applyCam();return}
  let a=1e9,c=1e9,d=-1e9,e=-1e9;for(const x of b){const bb=bbox(x);if(!bb)continue;a=Math.min(a,bb.x);c=Math.min(c,bb.y);d=Math.max(d,bb.x+bb.w);e=Math.max(e,bb.y+bb.h)}
  const top=isMobile()?110:80,padX=60;const z=clamp(Math.min((r.width-padX*2)/(d-a),(r.height-top-70)/(e-c)),.25,1.1);cam.z=z;cam.x=(r.width-(d-a)*z)/2-a*z;cam.y=top+((r.height-top-70)-(e-c)*z)/2-c*z;applyCam();renderBoard()}
function centerOn(b,readable){const r=stage.getBoundingClientRect();if(readable)cam.z=clamp(Math.max(cam.z,.8),.2,Math.min(1,(r.width-40)/b.w));const c=center(b);cam.x=r.width/2-c.x*cam.z;cam.y=r.height/2-c.y*cam.z;applyCam()}
function viewCenter(){const r=stage.getBoundingClientRect();return toWorld(r.left+r.width/2,r.top+r.height/2)}

/* ---------- Rendu du tableau ---------- */
function commentCount(kind,key){return state.comments.filter(c=>c.sid===state.current&&c.anchor&&c.anchor.kind===kind&&(kind==="verse"?c.anchor.ref===key:c.anchor.id===key)).length}
function htmlFor(e){
  const st=`left:${e.x}px;top:${e.y}px;width:${e.w}px`;
  if(e.type==="verse"&&e.mode==="wbw"){const v=verse(e.ref);const d=state.wbw[e.ref]||{t:{}};const cc=commentCount("el",e.id);
    return`<div class="el card wcard" data-id="${e.id}" style="${st}"><div class="vh"><span class="grow">${esc(v.label)} · mot à mot</span>${cc?`<span class="cbadge">${ICON.comment}${cc}</span>`:""}</div><div class="wrow" dir="rtl">${tiles(e.ref).map(t=>`<span class="wc"><span class="ar" lang="ar">${t.ar}</span><span class="wo ${d.t[t.i]?"":"empty"}" dir="ltr">${esc(d.t[t.i]||"—")}</span></span>`).join("")}</div>${d.free?`<div class="fr wfree-c">${esc(d.free)}</div>`:""}</div>`}
  if(e.type==="verse"){const v=verse(e.ref);const h=hls()[e.ref];const cc=commentCount("verse",e.ref)+commentCount("el",e.id);
    return`<div class="el card ${h?"hl-"+h:""}" data-id="${e.id}" style="${st}"><div class="vh"><span class="grow">${esc(v.label)}</span>${h?`<span class="tag t-${h}">${HL[h].label}</span>`:""}${cc?`<span class="cbadge">${ICON.comment}${cc}</span>`:""}</div><div class="ar" lang="ar" dir="rtl">${v.ar}</div><div class="fr">${esc(v.fr)}</div>${wolBlock(e.ref,false)}</div>`}
  if(e.type==="note"){const m=MEMBERS[e.by]||MEMBERS.me;const cc=commentCount("el",e.id);
    return`<div class="el note n-${e.color}" data-id="${e.id}" style="${st}"><div class="editable" data-ph="Écris ta réflexion…">${esc(e.text)}</div><div class="nby"><i style="--c:${m.c}"></i>${m.name}${cc?` · <span class="cbadge">${ICON.comment}${cc}</span>`:""}</div></div>`}
  if(e.type==="text")return`<div class="el text s-${e.size||"md"} tc-${e.color}" data-id="${e.id}" style="${st}"><div class="editable" data-ph="Titre…">${esc(e.text)}</div></div>`;
  return"";
}
function renderBoard(){
  const b=board();
  if(!editingId){els.innerHTML=b.map(htmlFor).join("");els.querySelectorAll(".el").forEach(n=>sizes[n.dataset.id]={w:n.offsetWidth,h:n.offsetHeight})}
  let back="",front="";const iz=1/cam.z;
  for(const e of b){const col=`var(--c-${e.color||"ink"})`;
    if(e.type==="rect"){const r=bbox(e);back+=`<g data-id="${e.id}"><rect class="hit" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="14" stroke-width="${14*iz}"/><rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="14" fill="none" style="stroke:${col}" stroke-width="2" stroke-dasharray="8 6"/></g>`}
    if(e.type==="arrow"){const p=arrowPts(e);if(!p)continue;const[p1,p2]=p;const an=Math.atan2(p2.y-p1.y,p2.x-p1.x),L=13;const h1={x:p2.x-L*Math.cos(an-.42),y:p2.y-L*Math.sin(an-.42)},h2={x:p2.x-L*Math.cos(an+.42),y:p2.y-L*Math.sin(an+.42)};
      back+=`<g data-id="${e.id}"><line class="hit" x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke-width="${16*iz}"/><line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" style="stroke:${col}" stroke-width="2.2" stroke-linecap="round"/><path d="M${h1.x} ${h1.y}L${p2.x} ${p2.y}L${h2.x} ${h2.y}" fill="none" style="stroke:${col}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>`}
    if(e.type==="stroke"){const d=pathD(e.points,e.x,e.y);front+=`<g data-id="${e.id}"><path class="hit" d="${d}" stroke-width="${14*iz}" stroke-linecap="round"/><path d="${d}" fill="none" style="stroke:${col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>`}
  }
  const s=selId&&el(selId);
  if(s&&!(drag&&["pen","rect","arrow"].includes(drag.kind))){const bb=bbox(s);if(bb){const p=6*iz;front+=`<rect class="selbox" x="${bb.x-p}" y="${bb.y-p}" width="${bb.w+2*p}" height="${bb.h+2*p}" rx="${8*iz}" vector-effect="non-scaling-stroke"/>`;
    if(["verse","note","text","rect"].includes(s.type)){const hs=11*iz;front+=`<rect class="handle" data-handle="1" x="${bb.x+bb.w+p-hs/2}" y="${bb.y+bb.h+p-hs/2}" width="${hs}" height="${hs}" rx="${2*iz}" stroke-width="${1.6*iz}"/>`}}}
  if(drag&&drag.hover){const hb=bbox(el(drag.hover));if(hb){const p=5*iz;front+=`<rect class="hovbox" x="${hb.x-p}" y="${hb.y-p}" width="${hb.w+2*p}" height="${hb.h+2*p}" rx="${10*iz}" vector-effect="non-scaling-stroke"/>`}}
  svgBack.innerHTML=back;svgFront.innerHTML=front;
  $("#emptyBoard").hidden=b.length>0;
  positionSelTools();
}

/* ---------- Barre d'outils ---------- */
function renderToolbar(){
  const t=TOOLS.map(x=>x.sep?'<span class="tsep"></span>':`<button class="tool" data-tool="${x.id}" aria-pressed="${tool===x.id}" title="${x.label} (${x.key})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${x.icon}</svg><span class="tl">${x.label} <kbd>${x.key}</kbd></span></button>`).join("");
  const s=selId&&el(selId);const active=s&&s.type!=="verse"?s.color:(tool==="note"?ui.noteColor:ui.color);

}

/* ---------- Sélection ---------- */
function select(id){selId=id;const e=id&&el(id);if(e&&e.type==="verse"&&ui.selVerse!==e.ref){ui.selVerse=e.ref;renderReader();if(ui.tab==="tafsir")renderSide()}renderToolbar();renderBoard()}
function positionSelTools(){const box=$("#seltools");const e=selId&&el(selId);if(!e||drag||editingId){box.hidden=true;return}
  const b=bbox(e);if(!b){box.hidden=true;return}
  let html="";
  if(e.type==="verse")html+=`<button data-st="show">Voir dans la lecture</button><button data-st="reflect">Ajouter une réflexion</button>`;
  if(e.type==="note"||e.type==="text")html+=`<button data-st="edit">Écrire</button>`;
  html+=`<button data-st="comment">Commenter</button>`;
  if(e.type!=="arrow")html+=`<button data-st="dup">Dupliquer</button>`;
  html+=`<button data-st="del" class="danger">Supprimer</button>`;
  box.innerHTML=html;box.hidden=false;
  let x=cam.x+(b.x+b.w/2)*cam.z,y=cam.y+b.y*cam.z-14;const r=stage.getBoundingClientRect();
  if(y<120){y=cam.y+(b.y+b.h)*cam.z+14+box.offsetHeight}
  x=clamp(x,box.offsetWidth/2+8,r.width-box.offsetWidth/2-8);
  box.style.left=x+"px";box.style.top=y+"px";
}
$("#seltools").addEventListener("pointerdown",e=>e.stopPropagation());
$("#seltools").addEventListener("click",e=>{const a=e.target.closest("[data-st]")?.dataset.st;const t=el(selId);if(!a||!t)return;
  if(a==="del")removeEl(t.id);
  if(a==="dup"){checkpoint();const c=JSON.parse(JSON.stringify(t));c.id=uid();c.x+=28;c.y+=28;board().push(c);save();select(c.id)}
  if(a==="comment")startComment({kind:"el",id:t.id});
  if(a==="edit")startEdit(t.id);
  if(a==="show")gotoVerse(t.ref);
  if(a==="reflect")addReflection(t.ref);
});
function removeEl(id){checkpoint();state.boards[state.current]=board().filter(e=>e.id!==id&&!(e.type==="arrow"&&(e.from.id===id||e.to.id===id)));selId=null;save();renderBoard();renderReader();renderToolbar();toast("Élément supprimé",{label:"Annuler",fn:undo})}

/* ---------- Édition de texte ---------- */
function startEdit(id){const e=el(id);if(!e||!["note","text"].includes(e.type))return;
  editingId=null;selId=id;renderBoard();editingId=id;positionSelTools();
  const n=els.querySelector(`[data-id="${id}"] .editable`);n.contentEditable="true";n.focus();
  const r=document.createRange();r.selectNodeContents(n);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r);
  n.addEventListener("keydown",ev=>{ev.stopPropagation();if(ev.key==="Escape"||(ev.key==="Enter"&&(ev.metaKey||ev.ctrlKey))){ev.preventDefault();n.blur()}});
  n.addEventListener("blur",()=>{const t=el(id);editingId=null;if(t){const txt=n.innerText.replace(/\n+$/,"").trim();if(txt!==t.text){checkpoint();t.text=txt}if(!txt){state.boards[state.current]=board().filter(x=>x.id!==id&&!(x.type==="arrow"&&(x.from.id===id||x.to.id===id)));selId=null}}save();renderBoard()},{once:true});
}

function addVerseCard(ref,at,silent,mode){mode=mode||"read";const ex=board().find(e=>e.type==="verse"&&e.ref===ref&&(e.mode||"read")===mode);
  if(ex){if(!silent){select(ex.id);centerOn(bbox(ex),true);renderBoard();toast(`${ref} est déjà sur le tableau`)}return ex}
  checkpoint();const p=at||viewCenter();const c={id:uid(),type:"verse",ref,x:p.x-170,y:p.y-60,w:mode==="wbw"?440:340};if(mode==="wbw")c.mode="wbw";board().push(c);save();renderBoard();renderReader();
  if(!silent){select(c.id);centerOn(bbox(c),true);renderBoard();toast(`Verset ${ref} ajouté au tableau`)}return c}
function addReflection(ref){if(isMobile())setPane("board");
  const card=addVerseCard(ref,null,true);const b=bbox(card);checkpoint();
  const n={id:uid(),type:"note",x:b.x+b.w+70,y:b.y,w:260,color:ui.noteColor,by:"me",text:""};board().push(n);
  board().push({id:uid(),type:"arrow",from:{id:card.id},to:{id:n.id},color:ui.noteColor});save();renderBoard();
  centerOn({x:b.x,y:b.y,w:b.w+330,h:b.h},true);renderBoard();setTool("select");startEdit(n.id)}
function bindable(id){const e=el(id);return e&&["verse","note","text","rect"].includes(e.type)}

stage.addEventListener("pointerdown",e=>{
  if(e.target.closest(".toolbar,.zoom,.undo,.hintbar,#seltools"))return;
  if(editingId){if(e.target.closest('[contenteditable="true"]'))return;document.activeElement&&document.activeElement.blur()}
  const w=toWorld(e.clientX,e.clientY);const tid=e.target.closest("[data-id]")?.dataset.id;const handle=e.target.closest("[data-handle]");
  stage.setPointerCapture(e.pointerId);
  if(e.button===1||tool==="hand"||spaceDown){drag={kind:"pan",sx:e.clientX,sy:e.clientY,ox:cam.x,oy:cam.y};stage.classList.add("panning");positionSelTools();return}
  if(e.button!==0)return;
  if(tool==="select"){
    if(handle&&selId){const t=el(selId);const b=bbox(t);drag={kind:"resize",id:selId,start:w,ow:t.type==="rect"?t.w:b.w,oh:t.h,cp:false};return}
    if(tid){if(selId!==tid)select(tid);drag={kind:"move",id:tid,start:w,orig:JSON.parse(JSON.stringify(el(tid))),cp:false};return}
    if(selId)select(null);drag={kind:"pan",sx:e.clientX,sy:e.clientY,ox:cam.x,oy:cam.y};stage.classList.add("panning");return}
  if(tool==="note"||tool==="text"){checkpoint();const n=tool==="note"?{id:uid(),type:"note",x:w.x-20,y:w.y-20,w:260,color:ui.noteColor,by:"me",text:""}:{id:uid(),type:"text",x:w.x,y:w.y-14,w:320,size:"md",color:ui.color,text:""};
    board().push(n);setTool("select");setTimeout(()=>startEdit(n.id),0);return}
  checkpoint();
  if(tool==="pen"){const n={id:uid(),type:"stroke",x:w.x,y:w.y,points:[[0,0]],color:ui.color,by:"me"};board().push(n);drag={kind:"pen",id:n.id}}
  if(tool==="rect"){const n={id:uid(),type:"rect",x:w.x,y:w.y,w:0,h:0,color:ui.color};board().push(n);drag={kind:"rect",id:n.id,sx:w.x,sy:w.y}}
  if(tool==="arrow"){const from=tid&&bindable(tid)?{id:tid}:{x:w.x,y:w.y};const n={id:uid(),type:"arrow",from,to:{x:w.x,y:w.y},color:ui.color};board().push(n);drag={kind:"arrow",id:n.id}}
  renderBoard();
});
stage.addEventListener("pointermove",e=>{if(!drag)return;const w=toWorld(e.clientX,e.clientY);const t=drag.id&&el(drag.id);
  switch(drag.kind){
    case"pan":cam.x=drag.ox+e.clientX-drag.sx;cam.y=drag.oy+e.clientY-drag.sy;applyCam();return;
    case"move":{const dx=w.x-drag.start.x,dy=w.y-drag.start.y;if(!drag.cp){if(Math.hypot(dx,dy)*cam.z<3)return;checkpoint();drag.cp=true;positionSelTools()}const o=drag.orig;
      if(t.type==="arrow"){if(!o.from.id)t.from={x:o.from.x+dx,y:o.from.y+dy};if(!o.to.id)t.to={x:o.to.x+dx,y:o.to.y+dy}}else{t.x=o.x+dx;t.y=o.y+dy}break}
    case"resize":{if(!drag.cp){checkpoint();drag.cp=true}const dx=w.x-drag.start.x,dy=w.y-drag.start.y;t.w=Math.max(t.type==="rect"?30:180,drag.ow+dx);if(t.type==="rect")t.h=Math.max(30,drag.oh+dy);break}
    case"pen":{const l=t.points[t.points.length-1];const p=[w.x-t.x,w.y-t.y];if(Math.hypot(p[0]-l[0],p[1]-l[1])>1.5/cam.z)t.points.push(p);break}
    case"rect":t.x=Math.min(drag.sx,w.x);t.y=Math.min(drag.sy,w.y);t.w=Math.abs(w.x-drag.sx);t.h=Math.abs(w.y-drag.sy);break;
    case"arrow":{t.to={x:w.x,y:w.y};drag.hover=null;for(const n of document.elementsFromPoint(e.clientX,e.clientY)){const id=n.closest&&n.closest("[data-id]")?.dataset.id;if(id&&id!==t.id&&id!==t.from.id&&bindable(id)){drag.hover=id;break}}break}
  }
  renderBoard();
});
function endDrag(){if(!drag)return;const t=drag.id&&el(drag.id);const k=drag.kind;
  if(k==="pen"&&t&&t.points.length<2){board().splice(board().indexOf(t),1);undoStack.pop()}
  if(k==="rect"&&t){if(t.w<8||t.h<8){board().splice(board().indexOf(t),1);undoStack.pop()}else{drag=null;setTool("select");select(t.id)}}
  if(k==="arrow"&&t){if(drag.hover)t.to={id:drag.hover};const p=arrowPts(t);if(!p||Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y)<12){board().splice(board().indexOf(t),1);undoStack.pop()}else{drag=null;setTool("select");select(t.id)}}
  if(k==="move"&&!drag.cp){}
  drag=null;stage.classList.remove("panning");save();updUndo();renderBoard();if(k==="move"||k==="resize")renderReader()}
stage.addEventListener("pointerup",endDrag);stage.addEventListener("pointercancel",endDrag);
stage.addEventListener("dblclick",e=>{if(e.target.closest(".toolbar,.zoom,.undo,#seltools"))return;const id=e.target.closest("[data-id]")?.dataset.id;const t=id&&el(id);
  if(t&&(t.type==="note"||t.type==="text")){startEdit(id);return}
  if(t&&t.type==="verse"){gotoVerse(t.ref);return}
  if(!t&&tool==="select"){const w=toWorld(e.clientX,e.clientY);checkpoint();const n={id:uid(),type:"note",x:w.x-20,y:w.y-20,w:260,color:ui.noteColor,by:"me",text:""};board().push(n);startEdit(n.id)}});
stage.addEventListener("wheel",e=>{if(e.target.closest(".toolbar"))return;e.preventDefault();const r=stage.getBoundingClientRect();
  if(e.ctrlKey||e.metaKey)zoomAt(e.clientX-r.left,e.clientY-r.top,cam.z*Math.exp(-e.deltaY*.01));else{cam.x-=e.deltaX;cam.y-=e.deltaY;applyCam()}},{passive:false});
stage.addEventListener("dragover",e=>{if([...e.dataTransfer.types].includes("text/x-verse")){e.preventDefault();stage.classList.add("drop")}});

$("#toolbar").addEventListener("click",e=>{const tb=e.target.closest("[data-tool]");if(tb){setTool(tb.dataset.tool);return}

$("#zIn").onclick=()=>zoomCenter(1.2);$("#zOut").onclick=()=>zoomCenter(1/1.2);$("#zFit").onclick=fitView;

/* ---------- Lecture ---------- */
function renderSurahSel(){$("#surahSel").innerHTML=Object.entries(SURAHS).map(([n,S])=>`<option value="${n}">${n}. ${S.name} — ${S.fr}</option>`).join("");$("#surahSel").value=cur().surah}
function renderReader(){const rb=$("#readerBody");const ae=document.activeElement;let keep=null;
  if(ae&&rb.contains(ae)&&ae.matches("input")){keep={sel:ae.dataset.free?`[data-free="${ae.dataset.free}"]`:`.wi[data-ref="${ae.dataset.ref}"][data-i="${ae.dataset.i}"]`,s:ae.selectionStart,e:ae.selectionEnd}}
  document.body.classList.toggle("wbw",state.readMode==="wbw");renderModebar();
  if(state.readMode==="wbw")renderWbw();else renderRead();
  if(keep){const n=rb.querySelector(keep.sel);if(n){n.focus({preventScroll:true});try{n.setSelectionRange(keep.s,keep.e)}catch(_){}}}}
const norm=w=>w.replace(/[ؐ-ًؚ-ٰٟۖ-ۭـ]/g,"").replace(/[أإآٱ]/g,"ا");
const loose=k=>k.split(" ").map(x=>x.replace(/^[وف](?=\S{2})/,"")).join(" ");
const wbwData=ref=>state.wbw[ref]||(state.wbw[ref]={t:{},joins:[],free:""});
const words=ref=>verse(ref).ar.split(/\s+/);
function tiles(ref){const w=words(ref),hs=(WBW_HINTS[ref]||"").split("|"),h=hs.length===w.length?hs:w.map(()=>""),d=state.wbw[ref]||{joins:[]};const out=[];let i=0;
  while(i<w.length){let j=i;while((d.joins||[]).includes(j)&&j<w.length-1)j++;out.push({i,j,ar:w.slice(i,j+1).join(" "),hint:h.slice(i,j+1).join(" ")});i=j+1}return out}
function allTiles(){const out=[];for(const ref in state.wbw){const d=state.wbw[ref];for(const t of tiles(ref)){const tx=(d.t[t.i]||"").trim();if(tx)out.push({ref,i:t.i,ar:t.ar,key:norm(t.ar),text:tx})}}return out}
function suggest(ref,t){const k=norm(t.ar);const all=allTiles().filter(x=>!(x.ref===ref&&x.i===t.i));let kind="same",m=all.filter(x=>x.key===k);
  if(!m.length){const lk=loose(k);m=all.filter(x=>loose(x.key)===lk);kind="close"}if(!m.length)return null;
  const cnt={};m.forEach(x=>cnt[x.text]=(cnt[x.text]||0)+1);const text=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];return{text,kind,ref:m.find(x=>x.text===text).ref}}
function surahProgress(s){let n=0,d=0;SURAHS[s].verses.forEach((v,k)=>{const ref=`${s}:${k+1}`,dd=state.wbw[ref];tiles(ref).forEach(t=>{n++;if(dd&&(dd.t[t.i]||"").trim())d++})});return{n,d}}
function wolBlock(ref,edit=true){if(state.showWolof===false)return"";const d=state.wbw[ref];if(!d)return"";const ts=tiles(ref);const has=ts.some(t=>(d.t[t.i]||"").trim());const free=(d.free||"").trim();if(!has&&!free)return"";
  return`<div class="wol"><div class="wolh"><span class="lab">Wolof</span>${edit?`<button class="link" data-wedit="${ref}">Modifier</button>`:""}</div>${free?`<p class="free">${esc(free)}</p>`:""}${has?`<div class="ilin" title="Mot à mot">${ts.map(t=>{const w=(d.t[t.i]||"").trim();return`<span><span class="a" lang="ar">${t.ar}</span><span class="w ${w?"":"e"}">${esc(w||"·")}</span></span>`}).join("")}</div>`:""}</div>`}
function renderModebar(){const w=state.readMode==="wbw";
  $("#modebar").innerHTML=`<div class="segm" role="group" aria-label="Mode de lecture"><button data-mode="read" aria-pressed="${!w}">Lecture</button><button data-mode="wbw" aria-pressed="${w}">Mot à mot</button></div>`+
  (!w?`<label class="chk"><input type="checkbox" id="wolChk" ${state.showWolof!==false?"checked":""}> Afficher le wolof</label>`:"")+(w?`<label class="chk"><input type="checkbox" id="hintChk" ${state.wbwHints!==false?"checked":""}> Indices en français</label><div class="chars"><small>Insérer</small>${["à","é","ë","ó","ñ","ŋ"].map(c=>`<button type="button" data-ch="${c}" title="Insérer ${c}" aria-label="Insérer ${c}">${c}</button>`).join("")}</div>`:"")}
function tileHtml(ref,t,d,showH){const tx=d.t[t.i]||"";const sg=tx?null:suggest(ref,t);const cc=state.comments.filter(c=>c.anchor&&c.anchor.kind==="word"&&c.anchor.ref===ref&&c.anchor.i===t.i).length;
  return`<div class="wt ${tx.trim()?"done":""} ${t.j>t.i?"merged":""}"><button class="wa" lang="ar" dir="rtl" tabindex="-1" data-wmenu="${ref}|${t.i}" title="Options du mot">${t.ar}${cc?`<span class="wdot" title="${cc} commentaire(s)"></span>`:""}</button>
    <input class="wi ${sg?"sug":""}" data-ref="${ref}" data-i="${t.i}" value="${esc(tx)}" placeholder="${esc(sg?sg.text:"…")}" data-sug="${esc(sg?sg.text:"")}" aria-label="Wolof pour ${t.ar}" autocomplete="off" spellcheck="false">
    ${sg?`<small class="ws">${sg.kind==="same"?"déjà traduit":"forme proche"} · ${sg.ref}</small>`:""}${showH&&t.hint?`<small class="wh">${esc(t.hint)}</small>`:""}</div>`}
function renderWbw(){const s=cur().surah,S=SURAHS[s];const p=surahProgress(s);const showH=state.wbwHints!==false;
  let out=`<div class="surah-head"><div class="ar" lang="ar">سورة ${S.ar}</div><div class="sub">${S.name} · mot à mot en wolof</div><div class="prog"><i style="width:${p.n?p.d/p.n*100:0}%"></i></div><div class="sub" id="progTxt">${p.d} / ${p.n} mots traduits</div></div>
  <p class="whelp"><b>Tab</b> : mot suivant · <b>Entrée</b> : verset suivant. Une suggestion en vert s'accepte avec <b>Tab</b> et s'ignore avec <b>Échap</b>. Clique un mot arabe pour le fusionner avec le suivant ou le commenter.</p>`;
  out+=`<ol class="verses">`+S.verses.map((v,k)=>{const ref=`${s}:${k+1}`;const d=state.wbw[ref]||{t:{},free:""};const ts=tiles(ref);const done=ts.filter(t=>(d.t[t.i]||"").trim()).length;const onB=board().some(e=>e.type==="verse"&&e.ref===ref&&e.mode==="wbw");
    return`<li class="wverse" data-ref="${ref}"><div class="vtop"><span class="vnum">${ref}</span><span class="wprog ${done===ts.length?"full":""}">${done}/${ts.length}</span><span style="flex:1"></span><button class="chip" data-wcard="${ref}">${onB?"Voir sur le tableau":"Mettre sur le tableau"}</button></div>
      <div class="wtiles">${ts.map(t=>tileHtml(ref,t,d,showH)).join("")}</div>
      <input class="wfree" data-free="${ref}" value="${esc(d.free||"")}" placeholder="Traduction wolof du verset (facultatif)" aria-label="Traduction wolof libre du verset ${ref}" autocomplete="off" spellcheck="false">
      ${showH?`<p class="wfr">${esc(v[1])}</p>`:""}</li>`}).join("")+`</ol>`;
  out+=`<p class="reader-foot">Prototype : découpage en mots entiers à partir du texte d'exemple, indices français indicatifs. Dans la vraie version, le découpage et les racines viendront du Quranic Arabic Corpus pour te proposer aussi tes traductions des mots de même racine.</p>`;
  $("#readerBody").innerHTML=out}
function updateProgress(ref){const li=$("#readerBody").querySelector(`.wverse[data-ref="${ref}"]`);if(li){const ts=tiles(ref),d=state.wbw[ref];const done=ts.filter(t=>(d.t[t.i]||"").trim()).length;const w=li.querySelector(".wprog");w.textContent=`${done}/${ts.length}`;w.classList.toggle("full",done===ts.length)}
  const p=surahProgress(cur().surah);const pt=$("#progTxt");if(pt){pt.textContent=`${p.d} / ${p.n} mots traduits`;$(".prog i").style.width=(p.n?p.d/p.n*100:0)+"%"}}
let saveT,lastWi=null,wDirty=false;function saveSoon(){clearTimeout(saveT);saveT=setTimeout(save,400)}
function refreshWCards(ref){if(!editingId&&board().some(e=>e.type==="verse"&&e.ref===ref)){cancelAnimationFrame(refreshWCards.r);refreshWCards.r=requestAnimationFrame(renderBoard)}}
function setWord(ref,i,val){wbwData(ref).t[i]=val;wDirty=true;saveSoon();updateProgress(ref);refreshWCards(ref)}
function goWord(ref,i){state.readMode="wbw";save();gotoVerse(ref);requestAnimationFrame(()=>{const n=$("#readerBody").querySelector(`.wi[data-ref="${ref}"][data-i="${i}"]`);n&&n.focus({preventScroll:true})})}
function wordMenu(btn){closeMenus();const[ref,si]=btn.dataset.wmenu.split("|");const ts=tiles(ref);const k=ts.findIndex(t=>t.i===+si);const t=ts[k];const r=btn.getBoundingClientRect();
  const m=document.createElement("div");m.className="menu";m.style.minWidth="240px";
  m.innerHTML=`<div class="muted" style="padding:4px 10px;font-size:12px;font-weight:600"><span lang="ar" style="font-family:var(--f-ar);font-size:20px;color:var(--ink)">${t.ar}</span> · ${ref}</div>
    ${k<ts.length-1?`<button class="mi" data-wa="join"><span>Fusionner avec le mot suivant</span><small>Pour une expression qui se traduit d'un bloc</small></button>`:""}
    ${t.j>t.i?`<button class="mi" data-wa="split"><span>Séparer en mots</span><small>Revenir au découpage mot par mot</small></button>`:""}
    <button class="mi" data-wa="comment"><span>Commenter ce mot</span><small>Par ex. pour discuter d'un choix de traduction</small></button>
    <button class="mi" data-wa="gloss"><span>Voir dans le glossaire</span><small>Toutes tes traductions de ce mot</small></button>`;
  document.body.appendChild(m);const mw=m.offsetWidth;m.style.left=clamp(r.left+r.width/2-mw/2,16,innerWidth-mw-16)+"px";m.style.top=Math.max(16,Math.min(r.bottom+6,innerHeight-m.offsetHeight-16))+"px";
  m.onclick=ev=>{const a=ev.target.closest("[data-wa]")?.dataset.wa;if(!a)return;closeMenus();const d=wbwData(ref);
    if(a==="join"){const nx=ts[k+1];for(let x=t.i;x<nx.j;x++)if(!d.joins.includes(x))d.joins.push(x);d.t[t.i]=[d.t[t.i],d.t[nx.i]].filter(x=>x&&x.trim()).join(" ");delete d.t[nx.i];save();renderReader();refreshWCards(ref);toast("Mots fusionnés",{label:"Séparer",fn:()=>{d.joins=d.joins.filter(x=>x<t.i||x>=nx.j);save();renderReader();refreshWCards(ref)}})}
    if(a==="split"){d.joins=d.joins.filter(x=>x<t.i||x>=t.j);save();renderReader();refreshWCards(ref);toast("Mots séparés")}
    if(a==="comment")startComment({kind:"word",ref,i:t.i});
    if(a==="gloss"){ui.tab="gloss";ui.glossQ=norm(t.ar);openSide();renderSide()}}}
function glossEntries(){const map=new Map();for(const x of allTiles()){if(!map.has(x.key))map.set(x.key,{ar:x.ar,key:x.key,tr:new Map()});const en=map.get(x.key);if(!en.tr.has(x.text))en.tr.set(x.text,[]);en.tr.get(x.text).push(x)}return[...map.values()]}
function renderGlossList(){const box=$("#glossList");if(!box)return;const q=(ui.glossQ||"").trim();const qn=norm(q).toLowerCase();let es=glossEntries();
  if(q)es=es.filter(e=>e.key.includes(qn)||[...e.tr.keys()].some(t=>t.toLowerCase().includes(qn)));es.sort((a,b)=>a.key.localeCompare(b.key,"ar"));
  box.innerHTML=es.length?es.map(e=>`<div class="gl"><div class="gar" lang="ar" dir="rtl">${e.ar}</div><div class="gtr">${[...e.tr].map(([t,occ])=>`<div><b>${esc(t)}</b> <span class="refs">${occ.map(o=>`<button data-gw="${o.ref}|${o.i}" title="Aller au mot">${o.ref}</button>`).join("")}</span></div>`).join("")}${e.tr.size>1?`<small class="muted">${e.tr.size} traductions différentes</small>`:""}</div></div>`).join("")
    :`<div class="empty">${q?"Aucun mot ne correspond.":"Ton glossaire se remplit tout seul quand tu traduis en mode « Mot à mot » dans la lecture."}</div>`}

  ${TOOLS.filter(t=>!t.sep).map(t=>`<kbd class="k">${t.key}</kbd><span>${t.label}</span>`).join("")}
  <kbd class="k">Espace + glisser</kbd><span>Se déplacer dans le tableau</span><kbd class="k">Ctrl + molette</kbd><span>Zoomer</span>
  <kbd class="k">Suppr</kbd><span>Supprimer la sélection</span><kbd class="k">Ctrl + Z</kbd><span>Annuler</span><kbd class="k">Ctrl + Maj + Z</kbd><span>Rétablir</span>
  <kbd class="k">Échap</kbd><span>Revenir à la sélection, ou fermer</span><kbd class="k">Double-clic</kbd><span>Écrire dans une note, ou en créer une</span></div>
  <p class="note-demo">Les données de ce prototype restent dans ton navigateur. <button class="link" id="resetDemo" style="padding:0;text-decoration:underline">Réinitialiser la démo</button></p>`).querySelector("#resetDemo").onclick=e=>{state=seed();save();closeMenus();switchSession(state.current);renderBell();toast("Démo réinitialisée")};
$("#tglReader").onclick=e=>{const on=document.body.classList.toggle("no-reader");e.currentTarget.setAttribute("aria-pressed",!on);requestAnimationFrame(()=>renderBoard())};
$("#tglSide").onclick=e=>{const on=document.body.classList.toggle("no-side");e.currentTarget.setAttribute("aria-pressed",!on);requestAnimationFrame(()=>renderBoard())};
document.querySelector(".mobnav").addEventListener("click",e=>{const b=e.target.closest("[data-pane]");if(b)setPane(b.dataset.pane)});

/* ---------- Clavier ---------- */
document.addEventListener("keydown",e=>{const tg=e.target;if(tg.closest&&(tg.closest("input,textarea,select,[contenteditable='true']")))return;
  if(e.key==="Escape"){if($(".scrim,.menu")){closeMenus();return}if(tool!=="select")setTool("select");else select(null);return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();e.shiftKey?redo():undo();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){e.preventDefault();redo();return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key===" "){spaceDown=true;stage.classList.add("panning");e.preventDefault();return}
  if((e.key==="Delete"||e.key==="Backspace")&&selId){e.preventDefault();removeEl(selId);return}
  if(e.key==="Enter"&&selId){const t=el(selId);if(t&&(t.type==="note"||t.type==="text")){e.preventDefault();startEdit(selId)}return}
  if(e.key==="?"){$("#helpBtn").click();return}
  const t=TOOLS.find(x=>x.key&&x.key.toLowerCase()===e.key.toLowerCase());if(t)setTool(t.id)});
document.addEventListener("keyup",e=>{if(e.key===" "){spaceDown=false;if(!drag)stage.classList.remove("panning")}});
addEventListener("resize",()=>positionSelTools());

/* ---------- Démarrage ---------- */
document.body.dataset.pane="board";setPane("board");
renderHeader();renderSurahSel();renderReader();renderToolbar();setTool("select");renderSide();renderBell();updUndo();renderBoard();
requestAnimationFrame(()=>{renderBoard();fitView();kMove()});
document.fonts&&document.fonts.ready.then(()=>{renderBoard()});
setInterval(kMove,4500);setTimeout(kComment,15000);
</script>
